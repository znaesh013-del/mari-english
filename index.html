 {t:"Present Perfect",
  help:`<h3>Урок 3. Present Perfect</h3>
   <p>Связывает прошлое с настоящим: важно не само время действия, а результат, опыт или связь с текущим моментом.</p>
   <h4>Утверждение</h4>
   <p><b>Подлежащее + have/has + V3</b></p>
   <ul><li><i>I have finished.</i> — Я закончил.</li><li><i>She has arrived.</i> — Она приехала.</li>
   <li><i>We have seen this film.</i> — Мы видели этот фильм.</li></ul>
   <p><i>Have</i> — с <i>I, you, we, they</i>. <i>Has</i> — с <i>he, she, it</i>.</p>
   <h4>Отрицание</h4>
   <p><b>Подлежащее + have/has + not + V3</b>. Сокращения: <i>haven't</i>, <i>hasn't</i>.</p>
   <ul><li><i>I have not finished.</i> — Я не закончил.</li><li><i>He has not called.</i> — Он не позвонил.</li></ul>
   <h4>Вопрос</h4>
   <p><b>Have/Has + подлежащее + V3?</b></p>
   <ul><li><i>Have you finished?</i> — Ты закончил?</li><li><i>Has she arrived?</i> — Она приехала?</li></ul>
   <h4>Основные случаи</h4>
   <ul><li>Результат важен сейчас: <i>I have lost my keys.</i></li>
   <li>Жизненный опыт без времени: <i>I have been to London.</i></li>
   <li>Действие длится до сих пор: <i>I have lived here for five years.</i></li>
   <li>Совсем недавно: <i>She has just arrived.</i></li></ul>
   <h4>Слова-маркеры</h4>
   <p><i>already</i> (уже), <i>just</i> (только что), <i>yet</i> (ещё), <i>ever</i> (когда-либо), <i>never</i> (никогда), <i>for</i> (в течение), <i>since</i> (с момента).</p>
   <p>Present Perfect не сочетается с завершённым прошлым (<i>yesterday</i>, <i>last year</i>) — там Past Simple: <i>I saw him yesterday</i>.</p>`,
  ex:[["Я закончил.","I have finished"],["Она приехала.","She has arrived"],["Мы видели этот фильм.","We have seen this film"],
      ["Я не закончил.","I have not finished"],["Он не позвонил.","He has not called"],["Ты закончил?","Have you finished"],
      ["Она приехала?","Has she arrived"],["Я потерял ключи.","I have lost my keys"],["Я был в Лондоне.","I have been to London"],
      ["Она только что приехала.","She has just arrived"],["Я никогда это не видел.","I have never seen this"],["Ты когда-нибудь был там?","Have you ever been there"]],
  w:[["finished","закончил"],["arrived","приехал"],["lost","потерял"],["seen","видел"],["called","позвонил"],["been","был"],
     ["already","уже"],["just","только что"],["yet","ещё"],["ever","когда-либо"],["never","никогда"],["for","в течение"],["since","с (момента)"]]},

 {t:"Согласование времён",
  help:`<h3>Урок 4. Согласование времён</h3>
   <p>Помогает передавать информацию, когда одно действие описывается внутри другого предложения. Особенно важно в косвенной речи.</p>
   <ul><li><i>He says, "I am tired."</i> — Он говорит: «Я устал».</li>
   <li><i>He says that he is tired.</i> — Он говорит, что устал.</li></ul>
   <p>Если глагол сообщения в настоящем, время внутри обычно не меняется. Если в прошедшем — время сдвигается назад:</p>
   <ul><li><i>Present Simple</i> → <i>Past Simple</i></li><li><i>Present Continuous</i> → <i>Past Continuous</i></li>
   <li><i>Past Simple</i> → <i>Past Perfect</i></li><li><i>Present Perfect</i> → <i>Past Perfect</i></li>
   <li><i>will</i> → <i>would</i></li><li><i>can</i> → <i>could</i></li><li><i>am/is/are</i> → <i>was/were</i></li></ul>
   <ul><li><i>He said that he worked there.</i> — Он сказал, что работает там.</li>
   <li><i>She said that she had finished.</i> — Она сказала, что закончила.</li></ul>
   <p>Обстоятельства тоже меняются: <i>today → that day</i>, <i>tomorrow → the next day</i>, <i>yesterday → the day before</i>, <i>here → there</i>.</p>
   <p>Если факт по-прежнему верен, настоящее иногда сохраняется: <i>The teacher said that water boils at 100°C.</i></p>`,
  ex:[["Он говорит, что устал.","He says that he is tired"],["Он сказал, что работает там.","He said that he worked there"],["Она сказала, что закончила.","She said that she had finished"],
      ["Он сказал, что устал.","He said he was tired"],["Она сказала, что придёт.","She said she would come"],["Он велел мне подождать.","He told me to wait"],
      ["Я думал, ты занят.","I thought you were busy"],["Я знал, что она права.","I knew she was right"],["Они сказали, что могут помочь.","They said they could help"],
      ["Я знал, что он ушёл.","I knew he had left"]],
  w:[["said","сказал"],["told","сказал кому-то"],["that","что"],["would","бы (will→would)"],["could","мог (can→could)"],["was","был"],
     ["had","имел (had)"],["knew","знал"],["thought","думал"],["the next day","на след. день"],["the day before","днём ранее"],["there","там"]]},

 {t:"Сложное дополнение (Complex Object)",
  help:`<h3>Урок 5. Сложное дополнение — Complex Object</h3>
   <p>Конструкция, чтобы сказать, что мы хотим, ожидаем, просим или наблюдаем, как другой человек что-то делает.</p>
   <p><b>Подлежащее + глагол + объект + инфинитив</b>: <i>I want you to stay.</i> — Я хочу, чтобы ты остался.</p>
   <p>После <i>want, would like, expect, ask, tell</i> — <i>to + V1</i>:</p>
   <ul><li><i>I want him to help me.</i> — Я хочу, чтобы он помог мне.</li>
   <li><i>She asked me to wait.</i> — Она попросила меня подождать.</li>
   <li><i>He told me to sit down.</i> — Он сказал мне сесть.</li></ul>
   <p>После <i>see, hear, watch, feel</i> — инфинитив <b>без to</b>:</p>
   <ul><li><i>I saw him leave.</i> — Я видел, как он ушёл.</li><li><i>We heard her sing.</i> — Мы слышали, как она пела.</li></ul>
   <p>Для действия в процессе — форма <i>-ing</i>: <i>I saw him crossing the street.</i></p>
   <p>После <i>make</i> и <i>let</i> — тоже без <i>to</i>: <i>She made me laugh.</i>, <i>Let me help you.</i> В пассиве после <i>make</i> появляется <i>to</i>: <i>I was made to wait.</i></p>`,
  ex:[["Я хочу, чтобы ты остался.","I want you to stay"],["Я хочу, чтобы он помог.","I want him to help"],["Она попросила меня подождать.","She asked me to wait"],
      ["Он велел мне сесть.","He told me to sit"],["Я видел, как он ушёл.","I saw him leave"],["Мы слышали, как она пела.","We heard her sing"],
      ["Она заставила меня смеяться.","She made me laugh"],["Позволь мне помочь.","Let me help you"],["Меня заставили ждать.","I was made to wait"],
      ["Мы ожидаем, что они придут.","We expect them to come"]],

     ["watch","наблюдать"],["feel","чувствовать"],["make","заставлять"],["let","позволять"],["stay","остаться"],["leave","уйти"],["laugh","смеяться"]]},

 {t:"Модальные глаголы",
  help:`<h3>Урок 6. Модальные глаголы</h3>
   <p>Выражают возможность, способность, обязанность, разрешение, совет и вероятность. После модального — V1 без <i>to</i>; он не меняется по лицам; в вопросе ставится перед подлежащим; в отрицании добавляется <i>not</i>.</p>
   <h4>Can — способность, возможность, разрешение</h4>
   <ul><li><i>I can swim.</i> — Я умею плавать.</li><li><i>Can I come in?</i> — Можно войти?</li><li><i>I cannot help you.</i> — Я не могу помочь.</li></ul>
   <h4>Could — прошлое, вежливость, меньшая уверенность</h4>
   <ul><li><i>I could swim when I was a child.</i> — Я умел плавать в детстве.</li><li><i>Could you help me?</i> — Не могли бы вы помочь?</li></ul>
   <h4>Must — необходимость или вывод</h4>
   <ul><li><i>You must stop.</i> — Ты должен остановиться.</li><li><i>He must be tired.</i> — Должно быть, он устал.</li></ul>
   <h4>Have to — необходимость</h4>
   <ul><li><i>I have to work tomorrow.</i> — Мне нужно работать завтра.</li><li><i>Do you have to go?</i> — Тебе нужно идти?</li></ul>
   <p>Различай: <i>mustn't</i> — нельзя, запрещено; <i>don't have to</i> — не обязательно.</p>
   <h4>Should — совет</h4>
   <ul><li><i>You should rest.</i> — Тебе следует отдохнуть.</li><li><i>You shouldn't worry.</i> — Тебе не стоит беспокоиться.</li></ul>
   <h4>May / might — возможность или разрешение</h4>
   <ul><li><i>It may rain.</i> — Возможно, пойдёт дождь.</li><li><i>She might be busy.</i> — Возможно, она занята.</li><li><i>May I ask a question?</i> — Можно задать вопрос?</li></ul>
   <h4>О прошлом: модальный + have + V3</h4>
   <ul><li><i>You should have called me.</i> — Тебе следовало позвонить.</li><li><i>He might have forgotten.</i> — Возможно, он забыл.</li><li><i>She must have left.</i> — Должно быть, она ушла.</li></ul>`,

      ["Мне нужно работать завтра.","I have to work tomorrow"],["Тебе нужно идти?","Do you have to go"],["Тебе следует отдохнуть.","You should rest"],
      ["Возможно, пойдёт дождь.","It may rain"],["Возможно, она занята.","She might be busy"],["Тебе следовало позвонить.","You should have called"],

     ["might","возможно"],["mustn't","нельзя"],["stop","остановиться"],["rest","отдыхать"],["rain","дождь"],["busy","занятый"],["forgotten","забыл"]]},

 {t:"Условные предложения",
  help:`<h3>Урок 7. Условные предложения</h3>
   <p>Описывают условие (<i>if</i>) и результат.</p>
   <h4>Zero Conditional — общие факты</h4>
   <p><b>If + Present Simple, Present Simple</b>: <i>If you heat ice, it melts.</i></p>
   <h4>First Conditional — реальное будущее</h4>
   <p><b>If + Present Simple, will + V1</b>:</p>
   <ul><li><i>If it rains, I will stay home.</i></li><li><i>If you call me, I will help you.</i></li></ul>
   <p>После <i>if</i> о будущем <i>will</i> не ставят: <i>If I have time, I will come.</i></p>
   <h4>Second Conditional — воображаемое</h4>
   <p><b>If + Past Simple, would + V1</b>:</p>
   <ul><li><i>If I had more time, I would travel.</i></li><li><i>If I were you, I would wait.</i></li></ul>
   <p>Past Simple здесь показывает гипотетичность, а не прошлое.</p>
   <h4>Third Conditional — нереализованное прошлое</h4>
   <p><b>If + Past Perfect, would have + V3</b>:</p>
   <ul><li><i>If I had known, I would have helped.</i></li>
   <li><i>If she had left earlier, she would have caught the train.</i></li></ul>
   <h4>Unless — если не</h4>
   <p><i>Unless you hurry, you will be late.</i></p>`,
  ex:[["Если нагреть лёд, он тает.","If you heat ice, it melts"],["Если пойдёт дождь, я останусь дома.","If it rains, I will stay home"],["Если у меня будет время, я приду.","If I have time, I will come"],
      ["Если ты позвонишь, я помогу.","If you call, I will help"],["На твоём месте я бы подождал.","If I were you, I would wait"],["Если бы было время, я бы путешествовал.","If I had time, I would travel"],
      ["Если бы я знал, я бы помог.","If I had known, I would help"],["Если не поторопишься, опоздаешь.","Unless you hurry, you will be late"]],
  w:[["if","если"],["unless","если не"],["would","бы"],["will","будет"],["melt","таять"],["heat","нагревать"],["rain","дождь"],
     ["stay","оставаться"],["travel","путешествовать"],["hurry","торопиться"],["late","поздно"],["were","был бы"],["known","знал"]]},

 {t:"Инфинитив",
  help:`<h3>Урок 8. Инфинитив</h3>
   <p>Начальная форма глагола, с частицей <i>to</i> или без неё.</p>
   <h4>To-infinitive: to + V1</h4>
   <p><i>to work</i> (работать), <i>to learn</i> (учиться), <i>to understand</i> (понимать). Используется после <i>want, need, decide, hope, plan, promise, agree, learn</i>:</p>
   <ul><li><i>I want to learn English.</i> — Я хочу выучить английский.</li><li><i>She decided to leave.</i> — Она решила уйти.</li>
   <li><i>We hope to see you.</i> — Мы надеемся увидеть тебя.</li></ul>
   <h4>Инфинитив цели</h4>
   <ul><li><i>I came here to help you.</i> — Я пришёл, чтобы помочь.</li><li><i>She works to earn money.</i> — Она работает, чтобы зарабатывать.</li></ul>
   <h4>После прилагательных</h4>
   <ul><li><i>I am happy to see you.</i> — Я рад тебя видеть.</li><li><i>It is difficult to explain.</i> — Это трудно объяснить.</li></ul>
   <h4>Инфинитив без to</h4>
   <p>После модальных: <i>I can swim</i>, <i>You should rest</i>. После <i>let</i>, <i>make</i>: <i>Let me go</i>, <i>They made him wait</i>.</p>`,
  ex:[["Я хочу выучить английский.","I want to learn English"],["Она решила уйти.","She decided to leave"],["Мы надеемся увидеть тебя.","We hope to see you"],
      ["Я пришёл, чтобы помочь.","I came here to help"],["Она работает, чтобы зарабатывать.","She works to earn money"],["Я рад тебя видеть.","I am happy to see you"],
      ["Это трудно объяснить.","It is difficult to explain"],["Позволь мне уйти.","Let me go"],["Они заставили его ждать.","They made him wait"],
      ["Мне нужно отдохнуть.","I need to rest"],["Я планирую путешествовать.","I plan to travel"]],
  w:[["to learn","учиться"],["to work","работать"],["want","хотеть"],["decide","решать"],["hope","надеяться"],["plan","планировать"],
     ["promise","обещать"],["agree","соглашаться"],["need","нуждаться"],["earn","зарабатывать"],["explain","объяснять"],["difficult","трудный"],["happy","рад"]]},

 {t:"Герундий",
  help:`<h3>Урок 9. Герундий</h3>
   <p>Форма глагола с <i>-ing</i> в роли существительного или занятия: <i>reading</i> (чтение), <i>swimming</i> (плавание), <i>learning</i> (обучение).</p>
   <h4>После некоторых глаголов — герундий</h4>
   <p><i>enjoy, finish, avoid, mind, suggest, keep, consider</i>:</p>
   <ul><li><i>I enjoy reading.</i> — Мне нравится читать.</li><li><i>She finished working.</i> — Она закончила работать.</li>
   <li><i>He avoids talking about it.</i> — Он избегает разговоров об этом.</li><li><i>Would you mind waiting?</i> — Вы не возражаете подождать?</li></ul>
   <h4>После предлогов — форма -ing</h4>
   <ul><li><i>Thank you for helping me.</i> — Спасибо, что помог.</li><li><i>She is interested in learning English.</i></li>
   <li><i>Before leaving, call me.</i> — Позвони перед уходом.</li></ul>
   <h4>Герундий как подлежащее</h4>
   <ul><li><i>Swimming is good for you.</i></li><li><i>Learning takes time.</i></li></ul>
   <h4>Герундий и инфинитив</h4>
   <p>После некоторых глаголов возможны обе формы: <i>I like reading</i> / <i>I like to read</i>. Но иногда выбор меняет смысл: <i>I stopped smoking</i> (бросил курить) и <i>I stopped to smoke</i> (остановился, чтобы покурить).</p>`,
  ex:[["Мне нравится читать.","I enjoy reading"],["Она закончила работать.","She finished working"],["Он избегает говорить об этом.","He avoids talking about it"],
      ["Вы не против подождать?","Would you mind waiting"],["Спасибо, что помог мне.","Thank you for helping me"],["Плавание полезно для тебя.","Swimming is good for you"],
      ["Обучение требует времени.","Learning takes time"],["Я бросил курить.","I stopped smoking"],["Я остановился, чтобы покурить.","I stopped to smoke"],
      ["Мне нравится читать.","I like reading"],["Она продолжает пытаться.","She keeps trying"]],
  w:[["reading","чтение"],["swimming","плавание"],["learning","обучение"],["enjoy","наслаждаться"],["finish","заканчивать"],["avoid","избегать"],
     ["mind","возражать"],["suggest","предлагать"],["keep","продолжать"],["consider","обдумывать"],["before","перед"],["after","после"],["for","за"]]},

 {t:"Глаголы с похожими значениями",
  help:`<h3>Урок 10. Глаголы с похожими значениями</h3>
   <h4>Say и tell</h4>
   <p><i>Say</i> — сами слова: <i>She said hello.</i>, <i>He said that he was tired.</i> <i>Tell</i> — сообщаем кому-то: <i>Tell me the truth.</i>, <i>She told me a story.</i> Конструкции: <i>say something</i>, <i>tell someone something</i>, <i>tell someone to do something</i>.</p>
   <h4>Speak и talk</h4>
   <p><i>Speak</i> — языки, официально, сам факт: <i>I speak English.</i>, <i>May I speak to you?</i> <i>Talk</i> — беседа: <i>We talked for an hour.</i></p>
   <h4>Hear и listen</h4>
   <p><i>Hear</i> — воспринимать звук: <i>I can hear music.</i> <i>Listen</i> — намеренно слушать, с <i>to</i>: <i>Listen to me.</i></p>
   <h4>Look, see, watch</h4>
   <p><i>look</i> — смотреть в сторону (часто <i>look at</i>), <i>see</i> — видеть, <i>watch</i> — наблюдать: <i>Look at this picture.</i>, <i>I can see a bird.</i>, <i>We watched a film.</i></p>
   <h4>Do и make</h4>
   <p><i>Do</i> — выполнять: <i>do homework</i>, <i>do the work</i>. <i>Make</i> — создавать, получать результат: <i>make a decision</i>, <i>make a mistake</i>, <i>make dinner</i>.</p>
   <h4>Know и learn</h4>
   <p><i>know</i> — знать: <i>I know English.</i> <i>learn</i> — изучать: <i>I am learning English.</i></p>`,
  ex:[["Она поздоровалась.","She said hello"],["Скажи мне правду.","Tell me the truth"],["Она рассказала мне историю.","She told me a story"],
      ["Я говорю по-английски.","I speak English"],["Мы разговаривали час.","We talked for an hour"],["Я слышу музыку.","I can hear music"],
      ["Послушай меня.","Listen to me"],["Посмотри на эту картину.","Look at this picture"],["Я вижу птицу.","I can see a bird"],
      ["Мы смотрели фильм.","We watched a film"],["Я готовлю ужин.","I make dinner"],["Я делаю домашнее задание.","I do my homework"]],
  w:[["say","сказать (слова)"],["tell","сказать (кому-то)"],["speak","говорить"],["talk","беседовать"],["hear","слышать"],["listen","слушать"],
     ["look","смотреть"],["see","видеть"],["watch","наблюдать"],["do","делать"],["make","создавать"],["know","знать"],["learn","изучать"]]},

 {t:"Сложные конструкции: too, enough, so, such",
  help:`<h3>Урок 11. Сложные конструкции с герундием и инфинитивом</h3>
   <h4>Глагол + инфинитив</h4>
   <p><i>want to do</i>, <i>decide to do</i>, <i>hope to do</i>, <i>promise to do</i>.</p>
   <h4>Глагол + герундий</h4>
   <p><i>enjoy doing</i>, <i>avoid doing</i>, <i>finish doing</i>, <i>keep doing</i>.</p>
   <h4>Глагол + объект + инфинитив</h4>
   <ul><li><i>I want you to come.</i></li><li><i>She asked me to help.</i></li><li><i>They expect us to win.</i></li></ul>
   <h4>Too и enough</h4>
   <p><i>too + прилагательное + to-infinitive</i> — слишком: <i>It is too difficult to explain.</i> <i>прилагательное + enough + to-infinitive</i> — достаточно: <i>He is old enough to drive.</i></p>
   <h4>So ... that / such ... that</h4>
   <ul><li><i>I was so tired that I fell asleep.</i></li><li><i>It was such a difficult task that we needed help.</i></li></ul>`,
  ex:[["Это слишком трудно объяснить.","It is too difficult to explain"],["Он достаточно взрослый, чтобы водить.","He is old enough to drive"],["Комната достаточно большая.","The room is big enough"],
      ["Я так устал, что заснул.","I was so tired that I slept"],["Я хочу, чтобы ты пришёл.","I want you to come"],["Она попросила меня помочь.","She asked me to help"],
      ["Они ожидают, что мы победим.","They expect us to win"],["Уже слишком поздно.","It is too late"],["Он достаточно силён.","He is strong enough"],
      ["Мне нравится учиться.","I enjoy learning"]],
  w:[["too","слишком"],["enough","достаточно"],["so","настолько"],["such","такой"],["that","что"],["difficult","трудный"],
     ["old","старый"],["strong","сильный"],["drive","водить"],["tired","усталый"],["win","побеждать"],["expect","ожидать"],["enjoy","наслаждаться"]]},

 {t:"Present Perfect и Perfect Continuous",
  help:`<h3>Урок 12. Present Perfect и Present Perfect Continuous</h3>
   <p>Оба времени связывают прошлое с настоящим, но акцент разный.</p>
   <h4>Present Perfect</h4>
   <p><b>have/has + V3</b> — акцент на результате, факте, количестве:</p>
   <ul><li><i>I have written three emails.</i></li><li><i>She has cleaned the room.</i></li></ul>
   <h4>Present Perfect Continuous</h4>
   <p><b>have/has + been + V-ing</b> — акцент на продолжительности или процессе:</p>
   <ul><li><i>I have been working for two hours.</i></li><li><i>She has been learning English since January.</i></li></ul>
   <h4>Сравнение</h4>
   <ul><li><i>I have read the book.</i> — важен результат.</li><li><i>I have been reading the book.</i> — важен процесс.</li></ul>
   <p>С глаголами состояния используется Present Perfect: <i>I have known him for years.</i> Нельзя сказать <i>I have been knowing him</i>.</p>`,
  ex:[["Я написал три письма.","I have written three emails"],["Она убрала комнату.","She has cleaned the room"],["Я работаю уже два часа.","I have been working for two hours"],
      ["Она изучает английский.","She has been learning English"],["Я прочитал книгу.","I have read the book"],["Я читаю эту книгу.","I have been reading the book"],
      ["Я знаю его много лет.","I have known him for years"],["Он бегал.","He has been running"],["Мы закончили.","We have finished"],
      ["Они ждали.","They have been waiting"]],
  w:[["written","написал (V3)"],["cleaned","убрал"],["working","работая"],["learning","изучая"],["reading","читая"],["running","бегая"],
     ["waiting","ожидая"],["been","(3-я форма be)"],["for","в течение"],["since","с"],["known","знал"],["result","результат"],["process","процесс"]]},

 {t:"Страдательный залог",
  help:`<h3>Урок 13. Страдательный залог</h3>
   <p>Используется, когда важнее действие или объект, чем исполнитель.</p>
   <ul><li>Актив: <i>The editor finished the video.</i></li><li>Пассив: <i>The video was finished.</i></li></ul>
   <p>Формула: <b>форма be + V3</b> (форма <i>be</i> зависит от времени):</p>
   <ul><li>Present Simple: <i>am/is/are + V3</i> — <i>The video is edited.</i></li>
   <li>Past Simple: <i>was/were + V3</i> — <i>The video was edited.</i></li>
   <li>Future Simple: <i>will be + V3</i> — <i>The video will be edited.</i></li>
   <li>Present Perfect: <i>have/has been + V3</i> — <i>The video has been edited.</i></li>
   <li>Present Continuous: <i>am/is/are being + V3</i> — <i>The video is being edited.</i></li></ul>
   <p>Исполнитель вводится через <i>by</i>: <i>The film was directed by him.</i> Пассив распространён в новостях, инструкциях и когда исполнитель неважен.</p>`,
  ex:[["Видео смонтировано.","The video is edited"],["Видео смонтировали.","The video was edited"],["Видео смонтируют.","The video will be edited"],
      ["Видео уже смонтировано.","The video has been edited"],["Видео сейчас монтируют.","The video is being edited"],["Фильм был снят им.","The film was directed by him"],
      ["Работа была завершена.","The work was finished"],["Дом был построен.","The house was built"],["Книга была написана.","The book was written"],
      ["Письмо было отправлено.","The letter has been sent"]],
  w:[["edited","смонтирован"],["finished","завершён"],["built","построен"],["written","написан"],["sent","отправлен"],["directed","снят"],
     ["be","быть"],["been","(3-я форма be)"],["being","(в процессе)"],["by","кем"],["done","сделан"],["passive","страдательный"]]},

 {t:"Модальные: предположения и выводы",
  help:`<h3>Урок 14. Модальные глаголы: предположения и выводы</h3>
   <p>Модальные глаголы выражают не только обязанность, но и степень уверенности в предположении.</p>
   <h4>Must — почти уверенный вывод</h4>
   <ul><li><i>He must be tired.</i> — Должно быть, он устал.</li><li><i>She must be at home.</i></li></ul>
   <h4>May / might / could — возможно</h4>
   <ul><li><i>He might be busy.</i></li><li><i>She may come later.</i></li><li><i>It could be true.</i></li></ul>
   <h4>Can't — уверенность в невозможности</h4>
   <ul><li><i>He can't be serious.</i></li><li><i>That can't be right.</i></li></ul>
   <h4>О прошлом: модальный + have + V3</h4>
   <ul><li><i>He must have forgotten.</i></li><li><i>She may have left.</i></li><li><i>He can't have done it.</i></li></ul>
   <p>Не путай: <i>He must have forgotten</i> — вывод о прошлом; <i>You should have called</i> — упрёк или сожаление.</p>`,
  ex:[["Должно быть, он устал.","He must be tired"],["Должно быть, она дома.","She must be at home"],["Возможно, он занят.","He might be busy"],
      ["Возможно, она придёт позже.","She may come later"],["Это может быть правдой.","It could be true"],["Не может быть, что он серьёзно.","He can't be serious"],
      ["Это не может быть так.","That can't be right"],["Должно быть, он забыл.","He must have forgotten"],["Возможно, она ушла.","She may have left"],
      ["Не может быть, что он это сделал.","He can't have done it"],["Тебе следовало позвонить.","You should have called"]],
  w:[["must","должно быть"],["may","возможно"],["might","возможно"],["could","может быть"],["can't","не может быть"],["should have","следовало"],
     ["must have","должно быть (прош.)"],["tired","усталый"],["busy","занятый"],["serious","серьёзный"],["true","правдивый"],["forgotten","забыл"]]},

 {t:"Условные конструкции и сложные предложения",
  help:`<h3>Урок 15. Условные конструкции и сложные предложения</h3>
   <h4>If only — если бы только</h4>
   <ul><li><i>If only I had more time!</i></li><li><i>If only I had known!</i></li></ul>
   <h4>I wish — хотелось бы</h4>
   <ul><li><i>I wish I knew the answer.</i></li><li><i>I wish I had more time.</i></li><li><i>I wish I had called you.</i> — сожаление о прошлом.</li></ul>
   <h4>Другие конструкции</h4>
   <ul><li><i>Unless you hurry, you'll be late.</i> — если не.</li>
   <li><i>You can stay as long as you are quiet.</i> — при условии.</li>
   <li><i>Take an umbrella in case it rains.</i> — на случай.</li>
   <li><i>I spoke slowly so that everyone could understand.</i> — чтобы.</li></ul>
   <p>Для цели также используется инфинитив: <i>I came here to help.</i> <i>to + V1</i> — компактная цель, <i>so that</i> — полноценная часть с подлежащим и глаголом.</p>`,
  ex:[["Если бы только у меня было время!","If only I had time"],["Если бы я только знал!","If only I had known"],["Хотелось бы мне знать ответ.","I wish I knew the answer"],
      ["Хотелось бы, чтобы было время.","I wish I had more time"],["Жаль, что я не позвонил.","I wish I had called you"],["Если не поторопишься, опоздаешь.","Unless you hurry, you will be late"],
      ["Возьми зонт на случай дождя.","Take an umbrella in case it rains"],["Я пришёл, чтобы помочь.","I came here to help"],["Хотелось бы мне знать английский.","I wish I knew English"]],
  w:[["if only","если бы только"],["I wish","хотелось бы"],["unless","если не"],["as long as","при условии"],["in case","на случай"],["so that","чтобы"],
     ["wish","желать"],["hurry","торопиться"],["quiet","тихий"],["umbrella","зонт"],["answer","ответ"],["rain","дождь"]]},

 {t:"Повторение сложных конструкций",

function buildCourse(arr){return arr.map((l,i)=>({
  id:i+1,title:l.t,grid:!!l.grid,help:l.help,words:l.w,
  ex:l.ex.map((e,j)=>{

function tenseGuess(en){
  const s=" "+en.toLowerCase()+" ";
  if(/ will | going to | tomorrow /.test(s))return "future";
  if(/ went | saw | ate | made | met | was | were | got | came | have | has | lost | left /.test(s)||/ed /.test(s))return "past";
  return "present";
}

"go","goes","went","come","came","see","saw","eat","get","got","turn","work","works","worked","live","play","read","speak","help",
"like","want","need","sleep","swim","drive","rest","cook","run","find","give","look","open","close",

function poolFor(ex){
  const ans=ex.words.map(w=>({w,a:true}));
  const have=new Set(ex.words.map(w=>w.toLowerCase()));
  const extra=BANK.filter(w=>!have.has(w.toLowerCase()));
  for(let k=extra.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[extra[k],extra[j]]=[extra[j],extra[k]];}
  const want=Math.max(2,Math.min(9-ex.words.length,ex.words.length>=6?2:3));
  const pool=ans.concat(extra.slice(0,want).map(w=>({w,a:false})));
  for(let k=pool.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[pool[k],pool[j]]=[pool[j],pool[k]];}
  return pool.map((t,idx)=>({...t,tid:idx}));
}

function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]];}return a;}

function pickVoice(){

  const vs=speechSynthesis.getVoices();
  const named=["Google US English","Samantha","Microsoft Aria Online (Natural) - English (United States)",
    "Microsoft Jenny Online (Natural) - English (United States)","Google UK English Female","Daniel","Karen"];
  VOICE=vs.find(v=>named.includes(v.name))
    ||vs.find(v=>/en-US/i.test(v.lang)&&/natural|online|google|siri|enhanced/i.test(v.name))
    ||vs.find(v=>/en-GB/i.test(v.lang)&&/natural|online|google|enhanced/i.test(v.name))
    ||vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
}

function pinHash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return "h"+h.toString(36);}
function loadDB(){
  let db=null;
  try{const r=localStorage.getItem(DBKEY);if(r)db=JSON.parse(r);}catch(e){db=null;}
  if(!db||db.version!==SCHEMA){
    db={version:SCHEMA,active:null,profiles:{}};
    PROFILES.forEach(p=>db.profiles[p.id]={name:p.name,pin:null,data:blankData()});
    try{const old=localStorage.getItem("timeline_score_v1");if(old){const o=JSON.parse(old);if(o&&typeof o==="object")db.profiles.p1.data.scores=o;}}catch(e){}
  }
  PROFILES.forEach(p=>{if(!db.profiles[p.id])db.profiles[p.id]={name:p.name,pin:null,data:blankData()};
    const d=db.profiles[p.id].data;d.scores=d.scores||{};d.words=d.words||{};d.listening=d.listening||{};d.books=d.books||{};});
  return db;
}
