<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Мари">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Мари</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: single-column app shell, sticky header + sticky score footer, centered content column */
:root{
  --bg:#eef2f9; --surface:#ffffff; --surface-2:#f5f8fe;
  --fg:#0f1b35; --muted:#5b6b8c; --line:#dde5f2;
  --accent:#2563eb; --accent-ink:#1b4fd1; --accent-soft:#e6eefc;
  --good:#16a34a; --good-soft:#e3f6ea; --bad:#dc2626; --bad-soft:#fdeaea; --warn:#f59e0b;
  --disp:"Rubik",system-ui,sans-serif; --body:"Golos Text",system-ui,sans-serif; --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1222; --surface:#121b31; --surface-2:#0f1830;
  --fg:#e8eefc; --muted:#93a3c4; --line:#243352;
  --accent:#4f8bff; --accent-ink:#86aeff; --accent-soft:#15284d;
  --good:#34d07f; --good-soft:#102a1f; --bad:#f26d6d; --bad-soft:#331519; --warn:#f6a93b;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b1222; --surface:#121b31; --surface-2:#0f1830;
  --fg:#e8eefc; --muted:#93a3c4; --line:#243352;
  --accent:#4f8bff; --accent-ink:#86aeff; --accent-soft:#15284d;
  --good:#34d07f; --good-soft:#102a1f; --bad:#f26d6d; --bad-soft:#331519; --warn:#f6a93b;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0;-webkit-font-smoothing:antialiased;line-height:1.45}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
h1,h2,h3,h4{font-family:var(--disp);text-wrap:balance;margin:0}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--accent);color:#fff;
  display:flex;align-items:center;gap:12px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--accent);z-index:10}
.badge{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.04em;background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:5px 7px;line-height:1.05;display:grid;place-items:center;text-align:center}
.hdr .ttl{font-family:var(--disp);font-weight:600;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .back{font-size:22px;line-height:1;padding:2px 6px;border-radius:8px}
.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:17px}
.icon-btn[aria-pressed="true"]{background:rgba(255,255,255,.22)}

.wrap{flex:1;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px;gap:10px}

.course{font-family:var(--disp);font-weight:600;font-size:13px;color:var(--accent-ink);background:var(--accent-soft);
  border-radius:10px;padding:10px 12px;text-align:center}
.lead{color:var(--muted);font-size:13px;margin:0 2px 2px}
.lcard{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:13px;text-align:left;width:100%}
.lnum{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);
  font-weight:600;font-size:14px;background:var(--surface-2);color:var(--accent-ink);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.lnum.part{background:var(--warn);color:#fff;border-color:transparent;font-size:12px}
.lnum.full{background:var(--good);color:#fff;border-color:transparent;font-size:16px}
.lcard h3{font-size:15px;font-weight:600}
.lcard p{margin:2px 0 0;color:var(--muted);font-size:13px}
.lcard .chev{margin-left:auto;color:var(--muted);font-size:18px}

.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:4px;gap:4px}
.seg button{flex:1;padding:8px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(15,27,53,.08);font-weight:600}

.pickrow label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
select{font-family:var(--body);font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);flex:1}

.tbl-scroll{overflow-x:auto;border-radius:var(--r)}
.gtable{width:100%;min-width:430px;border-collapse:separate;border-spacing:0;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gtable th{font-family:var(--disp);font-weight:600;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);padding:9px 4px;background:var(--surface-2)}
.gtable td{padding:9px 7px;vertical-align:middle;border-top:1px solid var(--line)}
.gtable td+td{border-left:1px solid var(--line)}
.gtable td.rl{width:22px;font-family:var(--disp);font-weight:600;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--accent-ink);background:var(--surface-2);writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;text-align:center;padding:4px}
.grp{display:flex;align-items:center;gap:6px;justify-content:flex-start}
.grp+.grp{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
.hlp{font-family:var(--disp);font-weight:700;font-size:11px;color:var(--accent-ink);flex:none}
.prns{display:flex;flex-direction:column;border-left:2px solid var(--accent);padding-left:5px;flex:none}
.prns span{font-size:10px;line-height:1.25;color:var(--muted);font-weight:500}
.form{font-family:var(--disp);font-weight:600;font-size:12.5px}
.form .mk{color:var(--accent-ink)}

.help{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.help h3{font-size:16px;margin-bottom:8px}
.help h4{font-family:var(--disp);font-size:13.5px;margin:12px 0 4px;color:var(--fg)}
.help p{color:var(--muted);font-size:13.5px;margin:0 0 7px}
.help b{color:var(--fg)}
.help i{color:var(--accent-ink);font-style:normal;font-weight:600}
.help ul{margin:4px 0 8px;padding-left:18px}
.help li{color:var(--muted);font-size:13.5px;margin:3px 0}
.help li b{color:var(--fg)}
.help .tip{background:var(--accent-soft);color:var(--accent-ink);border-radius:9px;padding:9px 11px;font-size:13px;margin:8px 0 0}
.hint{text-align:center;color:var(--muted);font-size:12.5px}

.btn{background:var(--accent);color:#fff;font-family:var(--disp);font-weight:600;font-size:16px;border-radius:12px;padding:14px;width:100%;
  text-align:center;box-shadow:0 4px 14px -4px color-mix(in srgb,var(--accent) 60%,transparent)}
.btn.ghost{background:var(--surface);color:var(--accent-ink);border:1px solid var(--line);box-shadow:none}

.timeline{display:flex;align-items:center;gap:8px;color:var(--muted);font-family:var(--disp);font-size:10px;letter-spacing:.08em;font-weight:600}
.track{flex:1;height:3px;background:linear-gradient(90deg,var(--line),var(--accent),var(--line));border-radius:2px;position:relative}
.track>i{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);
  transform:translate(-50%,-50%);transition:left .35s;box-shadow:0 0 0 3px var(--accent-soft)}
.prompt{text-align:center;font-size:22px;font-weight:500;margin:6px 0 2px;min-height:30px}
.answer{min-height:52px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-items:center;padding:6px 2px}
.answer .ph{color:var(--muted);font-size:14px;opacity:.7}
.chip{font-family:var(--disp);font-weight:500;font-size:16px;color:var(--accent-ink);background:var(--accent-soft);border-radius:9px;padding:7px 12px;line-height:1;cursor:pointer}
.clear{display:grid;place-items:center;margin:2px auto 0;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:16px;background:var(--surface)}
.pool{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:4px}
.tile{font-family:var(--disp);font-weight:500;font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 6px;color:var(--fg);transition:transform .08s,opacity .15s}
.tile:active{transform:scale(.96)}
.tile.used{opacity:.28;pointer-events:none}
.answer.ok .chip{background:var(--good-soft);color:var(--good)}
.answer.no .chip{background:var(--bad-soft);color:var(--bad)}

/* word trainer */
.wprompt{text-align:center;margin:14px 0 4px}
.wprompt .en{font-family:var(--disp);font-weight:700;font-size:32px;color:var(--accent-ink)}
.wprompt .sub{color:var(--muted);font-size:13px;margin-top:4px}
.spk{margin:6px auto 0;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px}
.wopts{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.wopt{text-align:left;font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--fg);transition:transform .08s}
.wopt:active{transform:scale(.99)}
.wopt.right{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.wopt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}

.verdict{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 16px;text-align:center;display:flex;flex-direction:column;gap:6px}
.verdict .mark{font-size:30px}
.verdict .lbl{color:var(--muted);font-size:13px}
.verdict .corr{font-family:var(--disp);font-weight:600;font-size:21px;color:var(--good)}
.verdict .tap{color:var(--muted);font-size:13px;margin-top:6px}

.foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:10px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.pbar{flex:1;height:8px;background:var(--line);border-radius:5px;overflow:hidden}
.pbar>i{display:block;height:100%;width:0;background:var(--good);border-radius:5px;transition:width .3s}
.pct{font-family:var(--disp);font-weight:600;font-size:14px;color:var(--good);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}

.done{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:20px 8px}
.done .ring{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:25px;color:#fff;background:var(--good)}
.done h2{font-size:21px}.done p{color:var(--muted);margin:0}
/* hub */
.hubgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.hubcard{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;min-height:108px}
.hubcard .ic{font-size:24px}
.hubcard h3{font-size:15px}
.hubcard p{margin:0;color:var(--muted);font-size:12px}
.hello{font-family:var(--disp);font-weight:600;font-size:17px;margin:2px}
/* profiles */
.proflist{display:flex;flex-direction:column;gap:10px}
.profcard{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;width:100%}
.pavatar{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:18px;color:#fff;background:var(--accent)}
.profcard h3{font-size:15px;font-weight:600}
.profcard p{margin:2px 0 0;color:var(--muted);font-size:12px}
.profcard .lock{margin-left:auto;color:var(--muted);font-size:15px}
.gearbtn{margin-left:8px;color:var(--muted);font-size:16px;padding:6px;border-radius:8px}
.pinwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:12px}
.pindots{display:flex;gap:12px}
.pindot{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.pindot.on{background:var(--accent)}
.pinpad{display:grid;grid-template-columns:repeat(3,64px);gap:12px}
.pinkey{height:64px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-family:var(--disp);font-size:22px;font-weight:600;color:var(--fg)}
.pinkey:active{background:var(--surface-2)}
.pinerr{color:var(--bad);font-size:13px;min-height:16px}
/* word cards */
.wface{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.wface .en{font-family:var(--disp);font-weight:700;font-size:30px;color:var(--accent-ink)}
.wface .ru{font-size:20px}
.wface .taphint{color:var(--muted);font-size:12px}
.wmarks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.wbtn{padding:14px;border-radius:12px;font-family:var(--disp);font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.wbtn.know{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.wbtn.rep{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.statrow{display:flex;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px}
.statrow b{font-family:var(--disp)}
/* listening player */
.srcnote{color:var(--muted);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.ltext{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;font-size:18px;line-height:2.1;white-space:pre-wrap}
.lword{cursor:pointer;border-radius:5px;padding:1px 2px}
.lword.active{background:var(--hi,var(--accent));color:#fff}
.rset{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--muted)}
.rset .grp2{display:flex;align-items:center;gap:6px}
.rset .sq{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);font-size:14px;display:grid;place-items:center;background:var(--surface);color:var(--fg)}
.rset .sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.rset .sw.on{border-color:var(--fg)}
.rset .tg{padding:5px 10px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:600}
.rset .tg.on{background:var(--accent);color:#fff;border-color:transparent}
.btext{white-space:normal}
.btext .bpar{margin:0 0 .85em}
.btext .bpar:first-child{margin-top:0}
.demonote{color:var(--accent-ink);font-size:12.5px;background:var(--accent-soft);border-radius:10px;padding:9px 11px}
.artprompt{font-size:19px;line-height:1.6;font-weight:500}
.artprompt .gap{display:inline-block;min-width:34px;text-align:center;color:var(--accent);border-bottom:2px dashed var(--accent);margin:0 4px}
.artprompt .gapf{color:var(--accent-ink);border-bottom:2px solid var(--accent-ink);padding:0 4px}
.pcontrols{display:flex;align-items:center;gap:10px}
.pbtn{width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;font-size:19px;display:grid;place-items:center;flex:none}
.pbtn.sec{background:var(--surface);color:var(--accent-ink);border:1px solid var(--line)}
.pbar2{flex:1;height:8px;background:var(--line);border-radius:5px;overflow:hidden;cursor:pointer}
.pbar2>i{display:block;height:100%;width:0;background:var(--accent);border-radius:5px}
.infobar{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:10px;padding:10px 12px;color:var(--accent-ink);font-weight:600;font-size:15px}
.infobar .sp{margin-left:auto;font-size:18px}
.msg{color:var(--muted);font-size:13px;text-align:center;padding:12px;background:var(--surface-2);border-radius:10px}
/* themed words */
.tic{font-size:22px;width:38px;text-align:center;flex:none}
.pctr{margin-left:auto;font-family:var(--disp);font-weight:600;font-size:14px;color:var(--muted);min-width:44px;text-align:right}
.pctr.part{color:var(--warn)}.pctr.full{color:var(--good)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.ttile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 8px;font-family:var(--disp);font-weight:600;font-size:16px;color:var(--fg);min-height:82px;overflow-wrap:anywhere;hyphens:auto}
.ttile:active{transform:scale(.97)}
.ttile.right{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.ttile.wrong{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.dlist{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.drow{display:flex;align-items:center;gap:10px;background:var(--surface);padding:11px 14px}
.dw{flex:1;min-width:0;display:flex;flex-direction:column}
.dw b{font-family:var(--disp);font-weight:600;font-size:15px}
.dw i{font-style:normal;color:var(--muted);font-size:13px}
.dbadge{font-family:var(--disp);font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:3px 9px;min-width:46px;text-align:center;flex:none}
.dbadge.ok{background:var(--good-soft);color:var(--good);border-color:var(--good)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="app">
  <header class="hdr">
    <button class="back" id="back" hidden aria-label="Назад">‹</button>
    <span class="badge">EN</span>
    <span class="ttl" id="htitle">Мари</span>
    <button class="icon-btn" id="prof" hidden aria-label="Профиль" title="Профиль">👤</button>
    <button class="icon-btn" id="sound" aria-pressed="false" aria-label="Звук" title="Озвучка">🔈</button>
  </header>
  <div class="wrap" id="view"></div>
  <footer class="foot" id="foot" hidden>
    <div class="pbar"><i id="pfill"></i></div>
    <span class="pct" id="ppct">0%</span>
  </footer>
</div>

<script>
/* ---------- conjugation engine (all persons) ---------- */
const CAP={i:"I",you:"You",we:"We",they:"They",he:"He",she:"She"};
const base=["I","you","we","they"], third=["he","she"], all=["I","you","we","they","he","she"];
const past=v=>v.endsWith("e")?v+"d":v+"ed";
const esForm=v=>v+"s";

/* ---------- 16 lessons: full theory text, exercises & word lists ---------- */
const DATA=[
 {t:"Базовая форма глагола",grid:true,
  help:`<h3>Урок 1. Три времени и три типа предложений</h3>
   <p>Главная задача — научиться говорить о том, что происходит обычно, происходило в прошлом и произойдёт в будущем. В каждом времени важно уметь строить утверждения, отрицания и вопросы.</p>
   <h4>1. Как устроено английское предложение</h4>
   <p>Основной порядок слов:</p>
   <p><b>КТО + ДЕЙСТВИЕ + ОСТАЛЬНАЯ ИНФОРМАЦИЯ</b></p>
   <ul><li><i>I work.</i> — Я работаю.</li><li><i>You sleep.</i> — Ты спишь.</li>
   <li><i>We watch a film.</i> — Мы смотрим фильм.</li><li><i>They live here.</i> — Они живут здесь.</li></ul>
   <p>В английском порядок слов гораздо строже, чем в русском. Обычно сначала указывается тот, кто выполняет действие, затем само действие и дополнительная информация.</p>
   <h4>2. Настоящее время — Present Simple</h4>
   <p>Используется для привычек, регулярных действий и фактов.</p>
   <ul><li><i>I work every day.</i> — Я работаю каждый день.</li><li><i>You speak English.</i> — Ты говоришь по-английски.</li>
   <li><i>We live in Moscow.</i> — Мы живём в Москве.</li><li><i>They play football.</i> — Они играют в футбол.</li></ul>
   <p>Для местоимений <i>he, she, it</i> к глаголу обычно добавляется окончание <i>-s</i>.</p>
   <ul><li><i>I work.</i> — Я работаю.</li><li><i>You work.</i> — Ты работаешь.</li>
   <li><i>He works.</i> — Он работает.</li><li><i>She works.</i> — Она работает.</li>
   <li><i>It works.</i> — Оно работает.</li><li><i>We work.</i> — Мы работаем.</li>
   <li><i>They work.</i> — Они работают.</li></ul>
   <p>Для некоторых глаголов используется окончание <i>-es</i>: <i>go → goes</i>, <i>watch → watches</i>. Если глагол заканчивается на согласную + y, y обычно меняется на <i>-ies</i>: <i>study → studies</i>.</p>
   <p><b>Отрицание:</b> <i>don't</i> + глагол или <i>doesn't</i> + глагол.</p>
   <ul><li><i>I don't work.</i> — Я не работаю.</li><li><i>They don't live here.</i> — Они здесь не живут.</li>
   <li><i>He doesn't work.</i> — Он не работает.</li><li><i>She doesn't speak English.</i> — Она не говорит по-английски.</li></ul>
   <p>После <i>doesn't</i> основной глагол используется без окончания <i>-s</i>: <i>She doesn't work</i>, а не <i>She doesn't works</i>.</p>
   <p><b>Вопрос:</b> <i>Do</i> или <i>Does</i> ставится перед подлежащим.</p>
   <ul><li><i>Do you work?</i> — Ты работаешь?</li><li><i>Do they live here?</i> — Они здесь живут?</li>
   <li><i>Does he work?</i> — Он работает?</li><li><i>Does she speak English?</i> — Она говорит по-английски?</li></ul>
   <h4>3. Будущее время — Future Simple</h4>
   <p>Для образования будущего времени используется конструкция <i>will</i> + глагол. Она одинакова для всех лиц.</p>
   <ul><li><i>I will work.</i> — Я буду работать.</li><li><i>She will come.</i> — Она придёт.</li>
   <li><i>They will help us.</i> — Они помогут нам.</li></ul>
   <p>Отрицание образуется с помощью <i>will not</i>, сокращённо <i>won't</i>.</p>
   <ul><li><i>I won't work tomorrow.</i> — Я не буду работать завтра.</li><li><i>He won't come.</i> — Он не придёт.</li></ul>
   <p>В вопросе <i>will</i> ставится перед подлежащим.</p>
   <ul><li><i>Will you work tomorrow?</i> — Ты будешь работать завтра?</li><li><i>Will they come?</i> — Они придут?</li></ul>
   <p>После <i>will</i> всегда используется начальная форма глагола: <i>will work, will go, will see</i>.</p>
   <h4>4. Прошедшее время — Past Simple</h4>
   <p>Используется для действий, которые произошли и завершились в прошлом. У правильных глаголов обычно добавляется окончание <i>-ed</i>:</p>
   <ul><li><i>work → worked</i> — работать → работал;</li><li><i>open → opened</i> — открывать → открыл;</li>
   <li><i>close → closed</i> — закрывать → закрыл;</li><li><i>play → played</i> — играть → играл.</li></ul>
   <p>Примеры:</p>
   <ul><li><i>I worked yesterday.</i> — Я работал вчера.</li><li><i>She opened the door.</i> — Она открыла дверь.</li>
   <li><i>They played football.</i> — Они играли в футбол.</li></ul>
   <p><b>Отрицание:</b> <i>didn't</i> + начальная форма глагола.</p>
   <ul><li><i>I didn't work yesterday.</i> — Я не работал вчера.</li><li><i>She didn't open the door.</i> — Она не открыла дверь.</li></ul>
   <p><b>Вопрос:</b> <i>Did</i> + подлежащее + начальная форма глагола.</p>
   <ul><li><i>Did you work yesterday?</i> — Ты работал вчера?</li><li><i>Did she open the door?</i> — Она открыла дверь?</li></ul>
   <p>После <i>did</i> и <i>didn't</i> глагол не получает окончание <i>-ed</i>: <i>Did you work?</i>, а не <i>Did you worked?</i></p>
   <h4>5. Правильные и неправильные глаголы</h4>
   <p>Правильные глаголы образуют прошедшую форму по общему правилу с <i>-ed</i>. У неправильных глаголов форма меняется особым образом.</p>
   <ul><li><i>go → went</i> — идти, ехать;</li><li><i>see → saw</i> — видеть;</li>
   <li><i>eat → ate</i> — есть;</li><li><i>make → made</i> — делать, создавать;</li>
   <li><i>come → came</i> — приходить;</li><li><i>have → had</i> — иметь;</li>
   <li><i>do → did</i> — делать.</li></ul>
   <p>Неправильные формы нужно запоминать. В последующих уроках появится ещё и третья форма глагола, необходимая для Present Perfect.</p>
   <p class="tip">Собирай предложение из плиток. Правильный ответ даёт +4%, ошибка −2%. Цель урока — дойти до 100%.</p>`,
  ex:[["Я работаю.","I work","present"],["Ты говоришь по-английски.","You speak English","present"],
      ["Мы живём в Москве.","We live in Moscow","present"],["Они играют в футбол.","They play football","present"],

      ["Она придёт.","She will come","future"],["Они помогут нам.","They will help us","future"],
      ["Я не буду работать.","I won't work","future"],["Он не придёт.","He won't come","future"],
      ["Ты будешь работать?","Will you work","future"],["Я работал вчера.","I worked yesterday","past"],
      ["Она открыла дверь.","She opened the door","past"],["Они играли в футбол.","They played football","past"],
      ["Я не работал вчера.","I didn't work yesterday","past"],["Ты работал?","Did you work","past"],
      ["Он пошёл домой.","He went home","past"],["Я видел это.","I saw it","past"]],
  w:[["work","работать"],["live","жить"],["play","играть"],["read","читать"],["speak","говорить"],["help","помогать"],

 {t:"Местоимения. Вопросительные слова",
  help:`<h3>Урок 2. Местоимения и вопросительные слова</h3>
   <p>Главная задача — научиться строить вопросы о людях, предметах, местах, времени и причинах событий.</p>
   <h4>1. Личные местоимения</h4>
   <p>Местоимение показывает, кто выполняет действие.</p>
   <ul><li><i>I</i> — я;</li><li><i>you</i> — ты, вы;</li><li><i>he</i> — он;</li><li><i>she</i> — она;</li>
   <li><i>it</i> — оно, это;</li><li><i>we</i> — мы;</li><li><i>they</i> — они.</li></ul>
   <p>В английском подлежащее обычно обязательно. Нельзя просто сказать <i>work</i> в значении «я работаю»: в обычном предложении нужно <i>I work</i>.</p>
   <p>Местоимение <i>it</i> используется для предметов, животных, а также в безличных выражениях:</p>
   <ul><li><i>It is cold.</i> — Холодно.</li><li><i>It is late.</i> — Поздно.</li><li><i>It works.</i> — Это работает.</li></ul>
   <h4>2. Шесть главных вопросительных слов</h4>
   <p><b>What — что, какой</b></p>
   <ul><li><i>What do you want?</i> — Что ты хочешь?</li><li><i>What is this?</i> — Что это?</li>
   <li><i>What do you do?</i> — Чем ты занимаешься? / Кем ты работаешь?</li></ul>
   <p><b>Where — где, куда</b></p>
   <ul><li><i>Where do you live?</i> — Где ты живёшь?</li><li><i>Where are you?</i> — Где ты?</li>
   <li><i>Where are you going?</i> — Куда ты идёшь?</li></ul>
   <p><b>Who — кто</b></p>
   <ul><li><i>Who is he?</i> — Кто он?</li><li><i>Who works here?</i> — Кто здесь работает?</li></ul>
   <p><b>When — когда</b></p>
   <ul><li><i>When will you come?</i> — Когда ты придёшь?</li><li><i>When do you work?</i> — Когда ты работаешь?</li></ul>
   <p><b>Why — почему</b></p>
   <ul><li><i>Why are you here?</i> — Почему ты здесь?</li><li><i>Why does he work here?</i> — Почему он работает здесь?</li></ul>
   <p><b>How — как</b></p>
   <ul><li><i>How are you?</i> — Как дела?</li><li><i>How do you work?</i> — Как ты работаешь?</li>
   <li><i>How does it work?</i> — Как это работает?</li></ul>
   <h4>3. Порядок слов в вопросе</h4>
   <p>Вопросительное слово обычно ставится первым, затем идёт вспомогательный глагол, подлежащее и основной глагол.</p>
   <p><b>Вопросительное слово + помощник + подлежащее + глагол</b></p>
   <ul><li><i>Where do you work?</i> — Где ты работаешь?</li><li><i>What does she want?</i> — Что она хочет?</li>
   <li><i>When will they come?</i> — Когда они придут?</li><li><i>Why did he leave?</i> — Почему он ушёл?</li></ul>
   <p>Если в предложении используется <i>to be</i>, дополнительный <i>do</i> не нужен:</p>
   <ul><li><i>Where are you?</i> — Где ты?</li><li><i>Why is she here?</i> — Почему она здесь?</li></ul>
   <p>Есть важное исключение: когда <i>who</i> само обозначает исполнителя действия, <i>do</i> обычно не требуется.</p>
   <ul><li><i>Who works here?</i> — Кто здесь работает?</li><li><i>Who called you?</i> — Кто тебе звонил?</li></ul>
   <p>Но если спрашиваем о том, на кого направлено действие, помощник нужен:</p>
   <ul><li><i>Who do you know?</i> — Кого ты знаешь?</li><li><i>Who did you see?</i> — Кого ты видел?</li></ul>`,
  ex:[["Кто это?","Who is this"],["Что это?","What is this"],["Что ты хочешь?","What do you want"],
      ["Где ты живёшь?","Where do you live"],["Где ты?","Where are you"],["Куда ты идёшь?","Where are you going"],
      ["Кто он?","Who is he"],["Кто здесь работает?","Who works here"],["Когда ты придёшь?","When will you come"],
      ["Когда ты работаешь?","When do you work"],["Почему ты здесь?","Why are you here"],["Как дела?","How are you"],
      ["Как это работает?","How does it work"],["Холодно.","It is cold"],["Поздно.","It is late"],["Чем ты занимаешься?","What do you do"]],
  w:[["I","я"],["you","ты, вы"],["he","он"],["she","она"],["it","оно, это"],["we","мы"],["they","они"],
     ["what","что"],["where","где, куда"],["who","кто"],["when","когда"],["why","почему"],["how","как"]]},

 {t:"Глагол to be. Предлоги места. Like/want",
  help:`<h3>Урок 3. Глагол to be, предлоги места, like и want</h3>
   <h4>1. Глагол to be</h4>
   <p><i>To be</i> означает «быть», «являться» или «находиться». В русском настоящем времени его часто опускают, но в английском он необходим при описании состояния, качества или местоположения.</p>
   <ul><li><i>I am a student.</i> — Я студент.</li><li><i>She is happy.</i> — Она счастлива.</li>
   <li><i>He is at home.</i> — Он дома.</li><li><i>They are tired.</i> — Они устали.</li></ul>
   <p>Формы настоящего времени: <i>I am</i>; <i>he / she / it is</i>; <i>you / we / they are</i>.</p>
   <p>В разговорной речи часто используются сокращения:</p>
   <ul><li><i>I am → I'm</i>;</li><li><i>he is → he's</i>;</li><li><i>she is → she's</i>;</li>
   <li><i>it is → it's</i>;</li><li><i>we are → we're</i>;</li><li><i>they are → they're</i>.</li></ul>
   <h4>2. Отрицания и вопросы с to be</h4>
   <p>Для отрицания добавляется <i>not</i>:</p>
   <ul><li><i>I am not tired.</i> — Я не устал.</li><li><i>She isn't here.</i> — Её здесь нет.</li>
   <li><i>They aren't ready.</i> — Они не готовы.</li></ul>
   <p>Для вопроса <i>to be</i> ставится перед подлежащим:</p>
   <ul><li><i>Are you at home?</i> — Ты дома?</li><li><i>Is she happy?</i> — Она счастлива?</li>
   <li><i>Are they ready?</i> — Они готовы?</li></ul>
   <p>С <i>to be</i> не используются <i>do</i> и <i>does</i> в обычных вопросах и отрицаниях. Поэтому правильно <i>Are you at home?</i>, а не <i>Do you are at home?</i></p>
   <h4>3. Предлоги места</h4>
   <p><b>In — внутри какого-либо пространства</b></p>
   <ul><li><i>in the room</i> — в комнате;</li><li><i>in the bag</i> — в сумке;</li><li><i>in the car</i> — в машине.</li></ul>
   <p><i>The keys are in the bag.</i> — Ключи в сумке.</p>
   <p><b>On — на поверхности</b></p>
   <ul><li><i>on the table</i> — на столе;</li><li><i>on the wall</i> — на стене;</li><li><i>on the floor</i> — на полу.</li></ul>
   <p><i>The phone is on the table.</i> — Телефон на столе.</p>
   <p><b>Under — под</b></p>
   <ul><li><i>under the chair</i> — под стулом;</li><li><i>under the table</i> — под столом.</li></ul>
   <p><i>The cat is under the table.</i> — Кот под столом.</p>
   <p><b>At — в определённой точке или месте</b></p>
   <ul><li><i>at home</i> — дома;</li><li><i>at work</i> — на работе;</li><li><i>at the door</i> — у двери;</li>
   <li><i>at the station</i> — на станции.</li></ul>
   <p><i>I am at home.</i> — Я дома. Выбор предлога зависит не только от физического положения, но и от привычного английского выражения.</p>
   <h4>4. Like и want</h4>
   <p><b>Want</b> означает «хотеть». Если после него идёт другое действие, обычно используется <i>to</i> + глагол:</p>
   <ul><li><i>I want to sleep.</i> — Я хочу спать.</li><li><i>I want to eat.</i> — Я хочу есть.</li>
   <li><i>She wants to work.</i> — Она хочет работать.</li></ul>
   <p>Для <i>he, she, it</i> в Present Simple используется <i>wants</i>.</p>
   <p><b>Like</b> означает «нравиться» или «любить».</p>
   <ul><li><i>I like music.</i> — Мне нравится музыка.</li><li><i>I like this film.</i> — Мне нравится этот фильм.</li>
   <li><i>I like to read.</i> — Я люблю читать.</li><li><i>She likes to cook.</i> — Она любит готовить.</li></ul>
   <p>После <i>like</i> возможны конструкции с <i>to</i> + глагол и с глаголом на <i>-ing</i>: <i>I like to read</i> и <i>I like reading</i>. Обе могут означать, что мне нравится читать.</p>`,
  ex:[["Я студент.","I am a student"],["Она счастлива.","She is happy"],["Он дома.","He is at home"],
      ["Они устали.","They are tired"],["Я не устал.","I am not tired"],["Её здесь нет.","She isn't here"],
      ["Ты дома?","Are you at home"],["Она счастлива?","Is she happy"],["Ключи в сумке.","The keys are in the bag"],
      ["Телефон на столе.","The phone is on the table"],["Кот под столом.","The cat is under the table"],
      ["Я на работе.","I am at work"],["Я хочу спать.","I want to sleep"],["Я хочу есть.","I want to eat"],
      ["Она хочет работать.","She wants to work"],["Мне нравится музыка.","I like music"],
      ["Я люблю читать.","I like to read"],["Она любит готовить.","She likes to cook"]],
  w:[["to be","быть"],["home","дом"],["student","студент"],["happy","счастливый"],["tired","усталый"],["ready","готовый"],
     ["in","в (внутри)"],["on","на"],["under","под"],["at","у, в (точке)"],["want","хотеть"],["like","нравиться"],
     ["music","музыка"],["cook","готовить"]]},

 {t:"Притяжательные местоимения",
  help:`<h3>Урок 4. Притяжательные местоимения</h3>
   <p>Притяжательные местоимения показывают, кому принадлежит предмет или с кем связан человек, действие либо понятие.</p>
   <h4>1. Основные формы</h4>
   <ul><li><i>my</i> — мой, моя, моё, мои;</li><li><i>your</i> — твой, твоя, ваш, ваши;</li>
   <li><i>his</i> — его;</li><li><i>her</i> — её;</li>
   <li><i>its</i> — его или её для предмета, животного или организации;</li>
   <li><i>our</i> — наш, наша, наше, наши;</li><li><i>their</i> — их.</li></ul>
   <p>Примеры:</p>
   <ul><li><i>my phone</i> — мой телефон;</li><li><i>your house</i> — твой дом;</li>
   <li><i>his car</i> — его машина;</li><li><i>her book</i> — её книга;</li>
   <li><i>our family</i> — наша семья;</li><li><i>their work</i> — их работа.</li></ul>
   <h4>2. Порядок слов</h4>
   <p>Притяжательное местоимение ставится перед существительным:</p>
   <ul><li><i>my name</i> — моё имя;</li><li><i>her room</i> — её комната;</li><li><i>their car</i> — их машина.</li></ul>
   <p>Артикль <i>a/an</i> или <i>the</i> обычно не ставится перед существительным, если перед ним уже стоит <i>my, your, his</i> и подобное слово. Правильно: <i>my phone</i>. Неправильно: <i>the my phone</i>.</p>
   <h4>3. His и her зависят от владельца</h4>
   <p>В английском притяжательное местоимение выбирается по тому, кому принадлежит вещь, а не по грамматическому роду самого предмета.</p>
   <ul><li><i>Alex has a car. His car is red.</i> — У Алекса есть машина. Его машина красная.</li>
   <li><i>Anna has a car. Her car is red.</i> — У Анны есть машина. Её машина красная.</li></ul>
   <p>Для животных и предметов может использоваться <i>its</i>, хотя при разговоре о домашнем животном его нередко называют <i>he</i> или <i>she</i>, если пол известен.</p>
   <h4>4. This is и these are</h4>
   <ul><li><i>This is my phone.</i> — Это мой телефон.</li><li><i>This is her room.</i> — Это её комната.</li>
   <li><i>These are my keys.</i> — Это мои ключи.</li></ul>
   <p><i>This</i> используется с одним предметом, <i>these</i> — с несколькими.</p>`,

 {t:"Профессии. Этикет",
  help:`<h3>Урок 5. Профессии и вежливое общение</h3>
   <h4>1. Как говорить о профессии</h4>
   <p>Профессия в единственном числе обычно употребляется с артиклем <i>a</i> или <i>an</i>.</p>
   <ul><li><i>I am a doctor.</i> — Я врач.</li><li><i>He is a teacher.</i> — Он учитель.</li>
   <li><i>She is an engineer.</i> — Она инженер.</li><li><i>I am a video editor.</i> — Я видеомонтажёр.</li></ul>
   <p>Выбор между <i>a</i> и <i>an</i> зависит от звука в начале следующего слова: <i>a teacher</i>, <i>a doctor</i>, <i>an editor</i>, <i>an engineer</i>. Артикль <i>an</i> используется перед гласным звуком, а не просто перед определённой буквой.</p>
   <h4>2. Как рассказать о работе</h4>
   <p>Фраза <i>What do you do?</i> — распространённый способ спросить о профессии или занятии.</p>
   <ul><li><i>What do you do?</i> — Кем ты работаешь?</li><li><i>I'm a video editor.</i> — Я видеомонтажёр.</li>
   <li><i>I edit videos.</i> — Я монтирую видео.</li><li><i>I work in video production.</i> — Я работаю в видеопроизводстве.</li></ul>
   <p>В английском можно описывать работу через профессию с <i>to be</i> или через действие с обычным глаголом: <i>I'm an editor</i> / <i>I edit films</i>.</p>
   <h4>3. Вежливые фразы</h4>
   <ul><li><i>Hello!</i> — Здравствуйте! / Привет!</li><li><i>Nice to meet you.</i> — Приятно познакомиться.</li>
   <li><i>Thank you.</i> — Спасибо.</li><li><i>Thank you very much.</i> — Большое спасибо.</li>
   <li><i>You're welcome.</i> — Пожалуйста, не за что.</li><li><i>Excuse me.</i> — Извините, можно обратиться?</li>
   <li><i>Sorry.</i> — Извините; мне жаль.</li><li><i>Have a good day.</i> — Хорошего дня.</li>
   <li><i>Please</i> — пожалуйста, используется в просьбах.</li></ul>
   <p><i>Excuse me</i> обычно помогает привлечь внимание или вежливо обратиться к человеку. <i>Sorry</i> чаще выражает извинение за поступок или ситуацию.</p>`,
  ex:[["Я врач.","I am a doctor"],["Он учитель.","He is a teacher"],["Она инженер.","She is an engineer"],
      ["Я монтажёр.","I am an editor"],["Кем ты работаешь?","What do you do"],["Я монтирую видео.","I edit videos"],
      ["Привет!","Hello"],["Приятно познакомиться.","Nice to meet you"],["Спасибо.","Thank you"],
      ["Большое спасибо.","Thank you very much"],["Пожалуйста.","You're welcome"],["Извините.","Excuse me"],
      ["Простите.","Sorry"],["Хорошего дня.","Have a good day"]],
  w:[["doctor","врач"],["teacher","учитель"],["engineer","инженер"],["editor","монтажёр"],["hello","привет"],
     ["thank you","спасибо"],["sorry","извините"],["please","пожалуйста"],["excuse me","извините (обратиться)"],
     ["welcome","не за что"],["day","день"],["film","фильм"]]},

 {t:"Степени сравнения прилагательных. Указательные местоимения",
  help:`<h3>Урок 6. Степени сравнения прилагательных и указательные местоимения</h3>
   <h4>1. Прилагательные в английском</h4>
   <p>Прилагательные описывают людей, предметы и явления.</p>
   <ul><li><i>a big house</i> — большой дом;</li><li><i>a new car</i> — новая машина;</li>
   <li><i>an interesting film</i> — интересный фильм.</li></ul>
   <p>В английском прилагательные не меняются по роду и числу: <i>a big house</i>, <i>a big car</i>, <i>big houses</i>.</p>
   <p>Чтобы описать предмет или человека, часто используется <i>to be</i>:</p>
   <ul><li><i>The house is big.</i> — Дом большой.</li><li><i>The car is new.</i> — Машина новая.</li>
   <li><i>The film is interesting.</i> — Фильм интересный.</li></ul>
   <h4>2. Сравнительная степень</h4>
   <p>Когда сравнивают два предмета, используют конструкцию с <i>than</i> — «чем». У многих коротких прилагательных добавляется <i>-er</i>:</p>
   <ul><li><i>small → smaller</i> — маленький → меньше;</li><li><i>tall → taller</i> — высокий → выше;</li>
   <li><i>fast → faster</i> — быстрый → быстрее;</li><li><i>big → bigger</i> — большой → больше.</li></ul>
   <p>В некоторых словах последняя согласная удваивается: <i>big → bigger</i>.</p>
   <ul><li><i>My room is smaller than your room.</i> — Моя комната меньше твоей.</li>
   <li><i>This car is faster than that car.</i> — Эта машина быстрее той.</li>
   <li><i>Alex is taller than me.</i> — Алекс выше меня.</li></ul>
   <p>У многих длинных прилагательных используется <i>more</i>: <i>interesting → more interesting</i>, <i>expensive → more expensive</i>. <i>This film is more interesting than that film.</i> — Этот фильм интереснее того.</p>
   <h4>3. Превосходная степень</h4>
   <p>Используется, когда выделяют предмет или человека среди группы. У коротких прилагательных часто применяется <i>the + -est</i>:</p>
   <ul><li><i>small → the smallest</i> — самый маленький;</li><li><i>tall → the tallest</i> — самый высокий;</li>
   <li><i>fast → the fastest</i> — самый быстрый.</li></ul>
   <p>У длинных прилагательных обычно используется <i>the most</i>: <i>the most interesting</i>, <i>the most expensive</i>.</p>
   <p>Важные исключения: <i>good → better → the best</i> (хороший → лучше → лучший); <i>bad → worse → the worst</i> (плохой → хуже → худший).</p>
   <h4>4. This, that, these, those</h4>
   <p>Эти слова указывают на предметы и различаются по числу и близости.</p>
   <ul><li><i>this</i> — этот, эта, это; один предмет рядом;</li><li><i>that</i> — тот, та, то; один предмет дальше;</li>
   <li><i>these</i> — эти; несколько предметов рядом;</li><li><i>those</i> — те; несколько предметов дальше.</li></ul>
   <ul><li><i>This phone is new.</i> — Этот телефон новый.</li><li><i>That house is big.</i> — Тот дом большой.</li>
   <li><i>These apples are red.</i> — Эти яблоки красные.</li><li><i>Those cars are expensive.</i> — Те машины дорогие.</li></ul>
   <p>Формы глагола <i>to be</i> согласуются с числом: <i>this is, that is, these are, those are</i>.</p>`,
  ex:[["Дом большой.","The house is big"],["Машина новая.","The car is new"],["Фильм интересный.","The film is interesting"],
      ["Моя комната меньше.","My room is smaller"],["Эта машина быстрее.","This car is faster"],["Алекс выше меня.","Alex is taller than me"],
      ["Этот фильм интереснее.","This film is more interesting"],["Это лучший день.","This is the best day"],["Он самый высокий.","He is the tallest"],
      ["Это худший день.","This is the worst day"],["Этот телефон новый.","This phone is new"],["Тот дом большой.","That house is big"],
      ["Эти яблоки красные.","These apples are red"],["Те машины дорогие.","Those cars are expensive"]],
  w:[["big","большой"],["small","маленький"],["tall","высокий"],["fast","быстрый"],["new","новый"],["old","старый"],
     ["good","хороший"],["bad","плохой"],["interesting","интересный"],["expensive","дорогой"],
     ["this","этот"],["that","тот"],["these","эти"],["those","те"]]},

 {t:"Слова-параметры. Употребление much и many",
  help:`<h3>Урок 7. Количество: much, many, some, any, few, little</h3>
   <h4>1. Исчисляемые и неисчисляемые существительные</h4>
   <p><b>Исчисляемые</b> — то, что можно посчитать поштучно:</p>
   <ul><li><i>one book, two books</i> — одна книга, две книги;</li>
   <li><i>one question, three questions</i> — один вопрос, три вопроса;</li>
   <li><i>one apple, five apples</i> — одно яблоко, пять яблок.</li></ul>
   <p><b>Неисчисляемые</b> — вещества, массы и понятия, которые обычно не считают поштучно:</p>
   <ul><li><i>water</i> — вода;</li><li><i>money</i> — деньги;</li><li><i>time</i> — время;</li>
   <li><i>information</i> — информация;</li><li><i>work</i> — работа.</li></ul>
   <p>Поэтому обычно не говорят <i>two informations</i>. Можно сказать <i>two pieces of information</i> — две единицы информации.</p>
   <h4>2. Many и much</h4>
   <p><b>Many</b> используется с исчисляемыми существительными во множественном числе: <i>many books</i>, <i>many people</i>, <i>many questions</i>.</p>
   <p><b>Much</b> используется с неисчисляемыми существительными: <i>much water</i>, <i>much time</i>, <i>much money</i>.</p>
   <p>В утвердительных предложениях в разговорной речи часто предпочитают <i>a lot of</i>, которое подходит для обеих групп.</p>
   <ul><li><i>I have a lot of work.</i> — У меня много работы.</li><li><i>She has a lot of books.</i> — У неё много книг.</li>
   <li><i>We have a lot of time.</i> — У нас много времени.</li></ul>
   <h4>3. Some и any</h4>
   <p><b>Some</b> часто используется в утвердительных предложениях: <i>I have some money</i>, <i>We need some water</i>.</p>
   <p><b>Any</b> часто используется в вопросах и отрицаниях:</p>
   <ul><li><i>Do you have any questions?</i> — У тебя есть вопросы?</li>
   <li><i>I don't have any money.</i> — У меня совсем нет денег.</li>
   <li><i>Is there any water?</i> — Есть ли вода?</li></ul>
   <p>Это не абсолютное правило. <i>Some</i> также употребляется, когда мы предлагаем что-то: <i>Would you like some tea?</i> — Хочешь чаю?</p>
   <h4>4. Few и little</h4>
   <p><i>Few</i> используется с исчисляемыми существительными, <i>little</i> — с неисчисляемыми: <i>few books</i>, <i>few people</i>, <i>little time</i>, <i>little money</i>.</p>
   <p>Разница между <i>a few</i> и <i>few</i>:</p>
   <ul><li><i>I have a few friends.</i> — У меня есть несколько друзей.</li>
   <li><i>I have few friends.</i> — У меня мало друзей.</li></ul>
   <p><i>A few</i> подчёркивает, что некоторое количество всё же есть; <i>few</i> чаще акцентирует недостаток. Аналогично: <i>I have a little time</i> (есть немного) и <i>I have little time</i> (мало).</p>`,
  ex:[["У меня много книг.","I have many books"],["Здесь много людей.","There are many people here"],["У меня много работы.","I have a lot of work"],
      ["У неё много книг.","She has a lot of books"],["Здесь много воды.","There is a lot of water here"],["У меня есть немного денег.","I have some money"],
      ["Нам нужно немного воды.","We need some water"],["У тебя есть вопросы?","Do you have any questions"],["У меня нет денег.","I don't have any money"],
      ["Есть вода?","Is there any water"],["У меня мало времени.","I have little time"],["У меня есть несколько друзей.","I have a few friends"],
      ["У меня мало друзей.","I have few friends"],["Хочешь чаю?","Would you like some tea"]],
  w:[["many","много (счётное)"],["much","много (несчётное)"],["a lot of","много"],["some","немного"],["any","сколько-нибудь"],
     ["few","мало (счётное)"],["little","мало (несчётное)"],["water","вода"],["money","деньги"],["time","время"],
     ["people","люди"],["question","вопрос"],["apple","яблоко"],["tea","чай"]]},

 {t:"Предлоги и параметры времени",
  help:`<h3>Урок 8. Предлоги времени и слова-ориентиры</h3>
   <h4>1. At, on и in</h4>
   <p><b>At</b> — конкретный момент или время на часах:</p>
   <ul><li><i>at five</i> — в пять часов;</li><li><i>at seven o'clock</i> — в семь часов;</li><li><i>at night</i> — ночью.</li></ul>
   <p><b>On</b> — дни недели и конкретные даты:</p>
   <ul><li><i>on Monday</i> — в понедельник;</li><li><i>on Friday</i> — в пятницу;</li><li><i>on May 5</i> — пятого мая.</li></ul>
   <p><b>In</b> — месяцы, годы, сезоны и многие части суток:</p>
   <ul><li><i>in May</i> — в мае;</li><li><i>in 2026</i> — в 2026 году;</li><li><i>in summer</i> — летом;</li>
   <li><i>in the morning</i> — утром;</li><li><i>in the evening</i> — вечером.</li></ul>
   <ul><li><i>I get up at seven.</i> — Я встаю в семь.</li><li><i>We work on Monday.</i> — Мы работаем в понедельник.</li>
   <li><i>She was born in May.</i> — Она родилась в мае.</li><li><i>I work in the morning.</i> — Я работаю утром.</li></ul>
   <h4>2. Когда предлог не нужен</h4>
   <p>Перед словами <i>today, tomorrow, yesterday, every day, last week</i> и <i>next year</i> обычно не ставится предлог времени.</p>
   <ul><li><i>I will come tomorrow.</i> — Я приду завтра.</li><li><i>I worked yesterday.</i> — Я работал вчера.</li>
   <li><i>We met last week.</i> — Мы встретились на прошлой неделе.</li><li><i>I work every day.</i> — Я работаю каждый день.</li></ul>
   <h4>3. Слова-ориентиры</h4>
   <ul><li><i>now</i> — сейчас;</li><li><i>today</i> — сегодня;</li><li><i>yesterday</i> — вчера;</li>
   <li><i>tomorrow</i> — завтра;</li><li><i>every day</i> — каждый день;</li>
   <li><i>last week</i> — на прошлой неделе;</li><li><i>next month</i> — в следующем месяце.</li></ul>
   <h4>4. Время и длительность</h4>
   <ul><li><i>at five</i> — в пять часов;</li><li><i>for five hours</i> — в течение пяти часов;</li>
   <li><i>from five to six</i> — с пяти до шести.</li></ul>
   <ul><li><i>I start at five.</i> — Я начинаю в пять.</li><li><i>I worked for five hours.</i> — Я работал пять часов.</li>
   <li><i>I work from five to six.</i> — Я работаю с пяти до шести.</li></ul>`,
  ex:[["Я встаю в семь.","I get up at seven"],["Мы работаем в понедельник.","We work on Monday"],["Она родилась в мае.","She was born in May"],
      ["Я работаю утром.","I work in the morning"],["Увидимся в понедельник.","See you on Monday"],["Я приду завтра.","I will come tomorrow"],
      ["Я работал вчера.","I worked yesterday"],["Мы встретились на прошлой неделе.","We met last week"],["Я работаю каждый день.","I work every day"],
      ["Сейчас три часа.","It is three o'clock"],["Я начинаю в пять.","I start at five"],["Я работал пять часов.","I worked for five hours"],["Ночью.","At night"]],
  w:[["at","в (час)"],["on","в (день)"],["in","в (месяц)"],["now","сейчас"],["today","сегодня"],["yesterday","вчера"],
     ["tomorrow","завтра"],["morning","утро"],["evening","вечер"],["night","ночь"],["Monday","понедельник"],
     ["week","неделя"],["month","месяц"],["hour","час"]]},

 {t:"There is / There are",
  help:`<h3>Урок 9. There is / There are</h3>
   <h4>1. Как сказать, что что-то где-то есть</h4>
   <p>Конструкция <i>there is / there are</i> используется, когда мы сообщаем о наличии предмета, человека или явления в определённом месте.</p>
   <p><b>There is</b> используется с одним предметом или неисчисляемым существительным.</p>
   <ul><li><i>There is a book on the table.</i> — На столе есть книга.</li>
   <li><i>There is a shop near my house.</i> — Рядом с моим домом есть магазин.</li>
   <li><i>There is a problem.</i> — Есть проблема.</li>
   <li><i>There is some water in the glass.</i> — В стакане есть немного воды.</li></ul>
   <p><b>There are</b> используется с исчисляемыми существительными во множественном числе.</p>
   <ul><li><i>There are two books on the table.</i> — На столе две книги.</li>
   <li><i>There are many people here.</i> — Здесь много людей.</li>
   <li><i>There are three rooms in the house.</i> — В доме три комнаты.</li></ul>
   <h4>2. Вопросы и отрицания</h4>
   <p>Для вопроса <i>is</i> или <i>are</i> ставится в начало:</p>
   <ul><li><i>Is there a shop here?</i> — Здесь есть магазин?</li><li><i>Are there two chairs?</i> — Здесь есть два стула?</li></ul>
   <p>Для отрицания используется <i>not</i>:</p>
   <ul><li><i>There isn't a shop here.</i> — Здесь нет магазина.</li>
   <li><i>There aren't any chairs.</i> — Здесь нет стульев.</li>
   <li><i>There is no water here.</i> — Здесь нет воды.</li></ul>
   <h4>3. Разница между there is и it is</h4>
   <ul><li><i>There is a book on the table.</i> — На столе есть книга. Сообщаем о наличии книги.</li>
   <li><i>The book is on the table.</i> — Книга на столе. Говорим, где находится конкретная книга.</li>
   <li><i>It is on the table.</i> — Она на столе. Заменяем уже известный предмет местоимением <i>it</i>.</li></ul>
   <p>Конструкция <i>there is / there are</i> вводит новую информацию о том, что где-то существует нечто. <i>It is</i> описывает уже известный объект или ситуацию.</p>`,
  ex:[["На столе есть книга.","There is a book on the table"],["Здесь есть магазин.","There is a shop here"],["Есть проблема.","There is a problem"],
      ["На столе две книги.","There are two books on the table"],["Здесь много людей.","There are many people here"],["В доме три комнаты.","There are three rooms in the house"],
      ["Здесь есть магазин?","Is there a shop here"],["Здесь есть стулья?","Are there any chairs"],["Здесь нет магазина.","There isn't a shop here"],
      ["Здесь нет воды.","There is no water here"],["Книга на столе.","The book is on the table"],["Она на столе.","It is on the table"]],
  w:[["there is","есть (один)"],["there are","есть (несколько)"],["book","книга"],["table","стол"],["shop","магазин"],
     ["room","комната"],["problem","проблема"],["chair","стул"],["people","люди"],["glass","стакан"],["house","дом"],["here","здесь"]]},

 {t:"Предлоги направления и движения",
  help:`<h3>Урок 10. Предлоги направления и движения</h3>
   <h4>1. To — движение к цели</h4>
   <p><i>To</i> часто обозначает направление к месту или человеку.</p>
   <ul><li><i>I go to work.</i> — Я иду на работу.</li><li><i>We go to school.</i> — Мы идём в школу.</li>
   <li><i>She is going to the shop.</i> — Она идёт в магазин.</li></ul>
   <p>Есть распространённые выражения без <i>to</i>: <i>go home</i> (идти домой), <i>come home</i> (приходить домой), <i>get home</i> (добираться домой). Но в выражениях <i>go to work</i> и <i>go to school</i> предлог <i>to</i> используется.</p>
   <h4>2. Into и out of</h4>
   <p><b>Into</b> подчёркивает движение внутрь пространства.</p>
   <ul><li><i>He went into the room.</i> — Он вошёл в комнату.</li><li><i>She got into the car.</i> — Она села в машину.</li></ul>
   <p><b>Out of</b> обозначает движение наружу.</p>
   <ul><li><i>Get out of the car.</i> — Выйди из машины.</li><li><i>He came out of the house.</i> — Он вышел из дома.</li></ul>
   <p>Разница: <i>in the room</i> — в комнате (местоположение); <i>into the room</i> — внутрь комнаты (направление).</p>
   <h4>3. Up, down, through и across</h4>
   <ul><li><i>up</i> — вверх;</li><li><i>down</i> — вниз;</li><li><i>through</i> — сквозь, через внутреннее пространство;</li>
   <li><i>across</i> — через пространство с одной стороны на другую.</li></ul>
   <ul><li><i>Go up the stairs.</i> — Поднимись по лестнице.</li><li><i>Go down the stairs.</i> — Спустись по лестнице.</li>
   <li><i>Walk through the park.</i> — Пройди через парк.</li><li><i>Walk across the street.</i> — Перейди улицу.</li></ul>
   <h4>4. Как объяснять дорогу</h4>
   <ul><li><i>Go straight.</i> — Иди прямо.</li><li><i>Turn left.</i> — Поверни налево.</li>
   <li><i>Turn right.</i> — Поверни направо.</li><li><i>Stop here.</i> — Остановись здесь.</li>
   <li><i>Follow me.</i> — Иди за мной.</li></ul>`,
  ex:[["Я иду на работу.","I go to work"],["Мы идём в школу.","We go to school"],["Иди домой.","Go home"],
      ["Он вошёл в комнату.","He went into the room"],["Она села в машину.","She got into the car"],["Выйди из машины.","Get out of the car"],
      ["Он вышел из дома.","He came out of the house"],["Поднимись по лестнице.","Go up the stairs"],["Спустись по лестнице.","Go down the stairs"],
      ["Иди прямо.","Go straight"],["Поверни налево.","Turn left"],["Поверни направо.","Turn right"],["Иди за мной.","Follow me"]],
  w:[["to","к, в"],["into","внутрь"],["out of","из"],["up","вверх"],["down","вниз"],["through","сквозь"],["across","через"],
     ["left","налево"],["right","направо"],["straight","прямо"],["home","домой"],["stairs","лестница"],["park","парк"],["street","улица"]]},

 {t:"Модальные глаголы can/must/should",
  help:`<h3>Урок 11. Модальные глаголы can, must и should</h3>
   <p>Модальные глаголы выражают возможность, обязанность, разрешение, запрет или совет. После <i>can, must</i> и <i>should</i> используется начальная форма глагола без частицы <i>to</i>.</p>
   <h4>1. Can — мочь, уметь</h4>
   <p><i>Can</i> выражает способность, умение или возможность что-то сделать.</p>
   <ul><li><i>I can swim.</i> — Я умею плавать.</li><li><i>I can help you.</i> — Я могу тебе помочь.</li>
   <li><i>She can drive.</i> — Она умеет водить машину.</li><li><i>Can you help me?</i> — Ты можешь мне помочь?</li></ul>
   <p>Отрицательная форма — <i>can't</i> или <i>cannot</i>.</p>
   <ul><li><i>I can't come today.</i> — Я не могу прийти сегодня.</li><li><i>He can't swim.</i> — Он не умеет плавать.</li></ul>
   <h4>2. Must — должен, обязан</h4>
   <p><i>Must</i> выражает сильную необходимость или обязанность.</p>
   <ul><li><i>I must work.</i> — Я должен работать.</li><li><i>We must go.</i> — Мы должны идти.</li>
   <li><i>You must listen.</i> — Ты должен слушать.</li></ul>
   <p>Отрицательная форма <i>mustn't</i> означает запрет: <i>You mustn't smoke here</i> (здесь нельзя курить). <i>Mustn't</i> не означает «не обязан» — для отсутствия необходимости используется <i>don't have to</i>: <i>You don't have to come</i> (тебе необязательно приходить).</p>
   <h4>3. Should — следует, стоит</h4>
   <p><i>Should</i> обычно выражает совет или рекомендацию.</p>
   <ul><li><i>You should rest.</i> — Тебе следует отдохнуть.</li><li><i>You should sleep more.</i> — Тебе стоит больше спать.</li>
   <li><i>We should go.</i> — Нам следует идти.</li><li><i>You shouldn't worry.</i> — Тебе не стоит беспокоиться.</li></ul>
   <h4>4. Вопросы с модальными глаголами</h4>
   <p>Модальный глагол ставится перед подлежащим:</p>
   <ul><li><i>Can you help?</i> — Ты можешь помочь?</li><li><i>Must I go now?</i> — Я должен идти сейчас?</li>
   <li><i>Should we wait?</i> — Нам следует подождать?</li></ul>
   <p>После модального глагола основной глагол не меняет форму: <i>She can work</i>, а не <i>She can works</i>.</p>`,
  ex:[["Я умею плавать.","I can swim"],["Я могу помочь.","I can help you"],["Она умеет водить.","She can drive"],
      ["Ты можешь помочь?","Can you help me"],["Я не могу прийти.","I can't come"],["Он не умеет плавать.","He can't swim"],
      ["Я должен работать.","I must work"],["Мы должны идти.","We must go"],["Здесь нельзя курить.","You mustn't smoke here"],
      ["Тебе следует отдохнуть.","You should rest"],["Тебе стоит больше спать.","You should sleep more"],["Не стоит беспокоиться.","You shouldn't worry"],
      ["Мне идти сейчас?","Must I go now"],["Нам подождать?","Should we wait"]],
  w:[["can","мочь, уметь"],["must","должен"],["should","следует"],["can't","не могу"],["mustn't","нельзя"],["shouldn't","не стоит"],
     ["swim","плавать"],["drive","водить"],["help","помогать"],["rest","отдыхать"],["wait","ждать"],["listen","слушать"],
     ["smoke","курить"],["go","идти"]]},

 {t:"Continuous",
  help:`<h3>Урок 12. Present Continuous: действие в процессе</h3>
   <h4>1. Когда используется Present Continuous</h4>
   <p>Present Continuous часто описывает действие, которое происходит прямо сейчас, или временную ситуацию в текущий период.</p>
   <p>Формула: <b>am / is / are + глагол-ing</b></p>
   <ul><li><i>I am working now.</i> — Я сейчас работаю.</li><li><i>She is reading.</i> — Она сейчас читает.</li>
   <li><i>They are playing.</i> — Они играют.</li><li><i>We are learning English.</i> — Мы учим английский.</li></ul>
   <p>Также время может описывать временную деятельность: <i>I'm reading a new book</i> (в данный период), <i>She's working from home this week</i> (на этой неделе).</p>
   <h4>2. Как образовать форму с -ing</h4>
   <p>Обычно к глаголу добавляется <i>-ing</i>: <i>work → working</i>, <i>read → reading</i>, <i>play → playing</i>, <i>cook → cooking</i>.</p>
   <p>Если глагол заканчивается на немую <i>e</i>, она обычно исчезает: <i>make → making</i>, <i>write → writing</i>, <i>come → coming</i>.</p>
   <p>В некоторых коротких глаголах последняя согласная удваивается: <i>run → running</i>, <i>sit → sitting</i>.</p>
   <h4>3. Вопросы и отрицания</h4>
   <p>Для отрицания добавляется <i>not</i> после <i>am, is</i> или <i>are</i>:</p>
   <ul><li><i>I am not working.</i> — Я не работаю сейчас.</li><li><i>She isn't sleeping.</i> — Она не спит.</li>
   <li><i>They aren't playing.</i> — Они не играют.</li></ul>
   <p>В вопросе <i>to be</i> ставится перед подлежащим:</p>
   <ul><li><i>Are you working?</i> — Ты сейчас работаешь?</li><li><i>Is she cooking?</i> — Она готовит?</li>
   <li><i>What are you doing?</i> — Что ты делаешь?</li><li><i>Where are they going?</i> — Куда они идут?</li></ul>
   <h4>4. Present Simple и Present Continuous</h4>
   <p>Present Simple описывает привычку или факт: <i>I edit videos</i> (это моя работа), <i>She reads every evening</i>.</p>
   <p>Present Continuous описывает действие в процессе: <i>I am editing a video</i> (сейчас), <i>She is reading now</i>.</p>
   <p>Некоторые глаголы состояния, например <i>know, understand</i> и <i>want</i>, обычно не используются в Continuous: говорят <i>I understand</i>, а не <i>I am understanding</i>.</p>`,
  ex:[["Я сейчас работаю.","I am working now"],["Она читает.","She is reading"],["Они играют.","They are playing"],
      ["Мы учим английский.","We are learning English"],["Я читаю новую книгу.","I am reading a new book"],["Я не работаю.","I am not working"],
      ["Она не спит.","She isn't sleeping"],["Они не играют.","They aren't playing"],["Ты работаешь?","Are you working"],
      ["Она готовит?","Is she cooking"],["Что ты делаешь?","What are you doing"],["Куда они идут?","Where are they going"],
      ["Он сейчас бежит.","He is running now"],["Я готовлю ужин.","I am cooking dinner"]],
  w:[["working","работает (сейчас)"],["reading","читает"],["playing","играет"],["cooking","готовит"],["sleeping","спит"],
     ["running","бежит"],["learning","учит"],["writing","пишет"],["doing","делает"],["going","идёт"],
     ["now","сейчас"],["English","английский"],["book","книга"],["dinner","ужин"]]},

 {t:"Описание людей. Погода",
  help:`<h3>Урок 13. Описание людей, предметов и погоды</h3>
   <h4>1. Описание через to be</h4>
   <p>Для описания внешности, характера и состояния часто используется <i>to be</i> + прилагательное.</p>
   <ul><li><i>He is tall.</i> — Он высокий.</li><li><i>She is kind.</i> — Она добрая.</li>
   <li><i>He is tired.</i> — Он устал.</li><li><i>I am happy.</i> — Я счастлив.</li>
   <li><i>They are busy.</i> — Они заняты.</li></ul>
   <p>Прилагательные в английском обычно не изменяются по роду и числу.</p>
   <h4>2. Описание предметов</h4>
   <ul><li><i>The room is big.</i> — Комната большая.</li><li><i>The phone is new.</i> — Телефон новый.</li>
   <li><i>The film is interesting.</i> — Фильм интересный.</li><li><i>My computer is slow.</i> — Мой компьютер медленный.</li>
   <li><i>This camera is expensive.</i> — Эта камера дорогая.</li></ul>
   <p>Для уточнения степени признака используются слова: <i>very</i> (очень), <i>really</i> (действительно), <i>quite</i> (довольно), <i>a little</i> (немного).</p>
   <ul><li><i>He is very tall.</i> — Он очень высокий.</li><li><i>The film is really good.</i> — Фильм действительно хороший.</li>
   <li><i>I am a little tired.</i> — Я немного устал.</li></ul>
   <h4>3. Как говорить о погоде</h4>
   <p>В английском для описания погоды часто используется формальное подлежащее <i>it</i>.</p>
   <ul><li><i>It is cold.</i> — Холодно.</li><li><i>It is sunny.</i> — Солнечно.</li>
   <li><i>It is windy.</i> — Ветрено.</li><li><i>It is raining.</i> — Идёт дождь.</li>
   <li><i>It is snowing.</i> — Идёт снег.</li></ul>
   <p>Чтобы говорить о погоде в прошлом, меняем <i>is</i> на <i>was</i>: <i>It was cold yesterday</i>, <i>It was sunny</i>.</p>
   <h4>4. Разница между описанием и действием</h4>
   <ul><li><i>He is tired.</i> — Он устал. Состояние.</li>
   <li><i>He is working.</i> — Он работает сейчас. Действие в процессе.</li>
   <li><i>He works every day.</i> — Он работает каждый день. Привычка.</li></ul>
   <p>Форма <i>to be</i> может быть самостоятельным глаголом описания или вспомогательной частью конструкции Continuous.</p>`,
  ex:[["Он высокий.","He is tall"],["Она добрая.","She is kind"],["Он устал.","He is tired"],["Я счастлив.","I am happy"],
      ["Они заняты.","They are busy"],["Комната большая.","The room is big"],["Телефон новый.","The phone is new"],
      ["Он очень высокий.","He is very tall"],["Я немного устал.","I am a little tired"],["Холодно.","It is cold"],
      ["Солнечно.","It is sunny"],["Идёт дождь.","It is raining"],["Идёт снег.","It is snowing"],["Вчера было холодно.","It was cold yesterday"]],
  w:[["tall","высокий"],["kind","добрый"],["tired","усталый"],["happy","счастливый"],["busy","занятый"],["slow","медленный"],
     ["cold","холодно"],["sunny","солнечно"],["windy","ветрено"],["raining","идёт дождь"],["snowing","идёт снег"],
     ["very","очень"],["really","действительно"],["expensive","дорогой"]]},

 {t:"Present perfect",
  help:`<h3>Урок 14. Present Perfect: результат и опыт</h3>
   <h4>1. Как образуется Present Perfect</h4>
   <p>Present Perfect связывает прошлое событие с настоящим. Он используется, когда важен результат к текущему моменту, жизненный опыт или событие в периоде, который ещё не завершён.</p>
   <p>Формула: <b>have / has + третья форма глагола</b></p>
   <ul><li><i>I have finished.</i> — Я закончил.</li><li><i>She has finished.</i> — Она закончила.</li>
   <li><i>We have arrived.</i> — Мы приехали.</li><li><i>He has left.</i> — Он ушёл.</li></ul>
   <p>Для <i>he, she, it</i> используется <i>has</i>, для остальных лиц — <i>have</i>.</p>
   <h4>2. Третья форма глагола</h4>
   <p>У правильных глаголов третья форма обычно совпадает с формой на <i>-ed</i>: <i>work → worked → worked</i>, <i>finish → finished → finished</i>, <i>open → opened → opened</i>.</p>
   <p>У неправильных глаголов форма может меняться:</p>
   <ul><li><i>go → went → gone</i>;</li><li><i>see → saw → seen</i>;</li><li><i>eat → ate → eaten</i>;</li>
   <li><i>make → made → made</i>;</li><li><i>do → did → done</i>;</li><li><i>be → was / were → been</i>.</li></ul>
   <ul><li><i>I have seen this film.</i> — Я видел этот фильм.</li><li><i>She has eaten.</i> — Она поела.</li>
   <li><i>We have done the work.</i> — Мы выполнили работу.</li></ul>
   <h4>3. Полезные слова</h4>
   <ul><li><b>Already</b> — уже: <i>I have already finished.</i></li>
   <li><b>Just</b> — только что: <i>She has just arrived.</i></li>
   <li><b>Never</b> — никогда: <i>I have never seen this film.</i></li>
   <li><b>Ever</b> — когда-либо (в вопросах об опыте): <i>Have you ever been to London?</i></li></ul>
   <h4>4. Present Perfect и Past Simple</h4>
   <p>Past Simple — о завершённом событии в определённый момент прошлого: <i>I finished the work yesterday</i>, <i>We met last week</i>.</p>
   <p>Present Perfect подчёркивает связь с настоящим: <i>I have finished the work</i> (важен результат), <i>I have lost my keys</i> (и сейчас их нет).</p>
   <p>С конкретным временем (<i>yesterday</i>, <i>last week</i>) обычно используется Past Simple.</p>
   <h4>5. Вопросы и отрицания</h4>
   <ul><li><i>I have finished.</i> — Я закончил.</li><li><i>I haven't finished.</i> — Я не закончил.</li>
   <li><i>Have you finished?</i> — Ты закончил?</li></ul>
   <p>Для <i>he, she, it</i>: <i>She has arrived</i>, <i>She hasn't arrived</i>, <i>Has she arrived?</i></p>`,
  ex:[["Я закончил.","I have finished"],["Она закончила.","She has finished"],["Мы приехали.","We have arrived"],["Он ушёл.","He has left"],
      ["Я видел этот фильм.","I have seen this film"],["Она поела.","She has eaten"],["Мы сделали работу.","We have done the work"],
      ["Я уже закончил.","I have already finished"],["Она только что приехала.","She has just arrived"],["Я никогда не видел это.","I have never seen this"],
      ["Ты когда-нибудь был в Лондоне?","Have you ever been to London"],["Я не закончил.","I haven't finished"],["Ты закончил?","Have you finished"],["Я потерял ключи.","I have lost my keys"]],
  w:[["finished","закончил"],["arrived","приехал"],["left","ушёл"],["seen","видел"],["eaten","поел"],["done","сделал"],
     ["gone","ушёл (3-я форма)"],["been","был (3-я форма)"],["already","уже"],["just","только что"],["never","никогда"],
     ["ever","когда-либо"],["lost","потерял"],["have","иметь"]]},

 {t:"Повелительное наклонение",
  help:`<h3>Урок 15. Повелительное наклонение: команды и просьбы</h3>
   <h4>1. Как дать команду или инструкцию</h4>
   <p>В повелительном наклонении обычно используется начальная форма глагола без подлежащего <i>you</i>.</p>
   <ul><li><i>Open the door.</i> — Открой дверь.</li><li><i>Sit down.</i> — Сядь.</li>
   <li><i>Come here.</i> — Иди сюда.</li><li><i>Listen to me.</i> — Послушай меня.</li>
   <li><i>Wait a minute.</i> — Подожди минуту.</li></ul>
   <p>Местоимение <i>you</i> не требуется, потому что обращение к собеседнику подразумевается.</p>
   <h4>2. Отрицательная команда</h4>
   <p>Чтобы попросить человека не делать что-либо, используется конструкция <b>don't + глагол</b>.</p>
   <ul><li><i>Don't go.</i> — Не уходи.</li><li><i>Don't worry.</i> — Не беспокойся.</li>
   <li><i>Don't touch it.</i> — Не трогай это.</li><li><i>Don't open the door.</i> — Не открывай дверь.</li>
   <li><i>Don't be late.</i> — Не опаздывай.</li></ul>
   <h4>3. Let's — предложение сделать что-то вместе</h4>
   <p><i>Let's</i> + глагол используется, когда говорящий предлагает совместное действие.</p>
   <ul><li><i>Let's go.</i> — Пойдём.</li><li><i>Let's start.</i> — Давай начнём.</li>
   <li><i>Let's eat.</i> — Давай поедим.</li><li><i>Let's watch a film.</i> — Давай посмотрим фильм.</li>
   <li><i>Let's do it.</i> — Давай сделаем это.</li></ul>
   <p>Отрицательная форма: <i>Let's not go</i> — Давай не пойдём.</p>
   <h4>4. Вежливые просьбы</h4>
   <p>Слово <i>please</i> делает просьбу вежливее.</p>
   <ul><li><i>Please wait.</i> — Пожалуйста, подожди.</li><li><i>Please help me.</i> — Пожалуйста, помоги мне.</li>
   <li><i>Please open the window.</i> — Пожалуйста, открой окно.</li></ul>
   <p>Более мягкий способ — вопрос: <i>Can you help me, please?</i>, <i>Could you open the window, please?</i> <i>Could you</i> звучит вежливее и мягче, чем прямое повелительное наклонение.</p>`,

 {t:"Фразовые глаголы",
  help:`<h3>Урок 16. Фразовые глаголы</h3>
   <h4>1. Что такое фразовый глагол</h4>
   <p>Фразовый глагол состоит из глагола и частицы, например <i>up, off, on, out</i> или <i>for</i>. Вместе они могут образовывать новое значение, которое не всегда можно понять по отдельным словам.</p>
   <p>Например: <i>get</i> — получать, добираться; <i>get up</i> — вставать. Поэтому фразовые глаголы полезно запоминать как готовые выражения.</p>
   <h4>2. Get up — вставать</h4>
   <ul><li><i>I get up at seven.</i> — Я встаю в семь.</li><li><i>I don't want to get up.</i> — Я не хочу вставать.</li>
   <li><i>He got up early.</i> — Он рано встал.</li></ul>
   <p>Форма прошедшего времени глагола <i>get</i> в этом значении — <i>got</i>.</p>
   <h4>3. Turn on и turn off — включать и выключать</h4>
   <ul><li><i>Turn on the light.</i> — Включи свет.</li><li><i>Turn off the TV.</i> — Выключи телевизор.</li>
   <li><i>I turned on the computer.</i> — Я включил компьютер.</li><li><i>She turned off the light.</i> — Она выключила свет.</li></ul>
   <p>Эти глаголы допускают два порядка слов: <i>Turn on the light</i> и <i>Turn the light on</i>. Если объект — местоимение <i>it</i>, оно ставится между частями: <i>Turn it on</i>, <i>Turn it off</i>.</p>
   <h4>4. Look for — искать</h4>
   <ul><li><i>I'm looking for my keys.</i> — Я ищу свои ключи.</li><li><i>What are you looking for?</i> — Что ты ищешь?</li>
   <li><i>I'm looking for my phone.</i> — Я ищу свой телефон.</li></ul>
   <p><i>Look for</i> — процесс поиска. Не путать с <i>look at</i> — смотреть на что-либо: <i>Look at this photo</i> — Посмотри на эту фотографию.</p>
   <h4>5. Give up — сдаваться</h4>
   <ul><li><i>Don't give up.</i> — Не сдавайся.</li><li><i>I won't give up.</i> — Я не сдамся.</li>
   <li><i>He gave up.</i> — Он сдался.</li></ul>
   <p>Форма прошедшего времени <i>give up</i> — <i>gave up</i>.</p>
   <h4>6. Find out — выяснить, узнать</h4>
   <ul><li><i>I want to find out.</i> — Я хочу выяснить.</li><li><i>I found out the truth.</i> — Я узнал правду.</li>
   <li><i>We need to find out.</i> — Нам нужно выяснить.</li></ul>
   <h4>7. Как учить фразовые глаголы</h4>
   <p>Не нужно переводить каждую частицу дословно. Лучше запоминать сочетание целиком, с простым примером. Фразовые глаголы меняются по временам так же, как обычные: <i>I turn on the light</i>, <i>I turned on the light</i>, <i>I will turn on the light</i>, <i>I'm turning on the light</i>.</p>`,
  ex:[["Я встаю в семь.","I get up at seven"],["Он рано встал.","He got up early"],["Включи свет.","Turn on the light"],
      ["Выключи телевизор.","Turn off the TV"],["Я включил компьютер.","I turned on the computer"],["Включи это.","Turn it on"],
      ["Выключи это.","Turn it off"],["Я ищу ключи.","I am looking for my keys"],["Что ты ищешь?","What are you looking for"],
      ["Посмотри на это фото.","Look at this photo"],["Не сдавайся.","Don't give up"],["Я не сдамся.","I won't give up"],
      ["Я хочу выяснить.","I want to find out"],["Я узнал правду.","I found out the truth"]],
  w:[["get up","вставать"],["turn on","включать"],["turn off","выключать"],["look for","искать"],["give up","сдаваться"],
     ["find out","выяснить"],["look at","смотреть на"],["light","свет"],["keys","ключи"],["phone","телефон"],
     ["truth","правда"],["computer","компьютер"],["TV","телевизор"],["early","рано"]]},

 {t:"Три формы глагола",
  help:`<h3>Урок 1. Три формы глагола</h3>
   <p>Многие глаголы имеют три основные формы:</p>
   <ul><li><b>V1</b> — начальная форма: <i>go</i> — идти.</li>
   <li><b>V2</b> — прошедшее время: <i>went</i> — шёл.</li>
   <li><b>V3</b> — причастие прошедшего времени: <i>gone</i> — для сложных конструкций.</li></ul>
   <p>Правильные глаголы образуют V2 и V3 добавлением <i>-ed</i>: <i>work — worked — worked</i>, <i>play — played — played</i>, <i>finish — finished — finished</i>.</p>
   <p>Неправильные глаголы имеют собственные формы:</p>
   <ul><li><i>go — went — gone</i>;</li><li><i>see — saw — seen</i>;</li><li><i>do — did — done</i>;</li>
   <li><i>write — wrote — written</i>;</li><li><i>take — took — taken</i>.</li></ul>
   <h4>Где используются формы</h4>
   <ul><li><b>V1</b> — настоящее, будущее с <i>will</i>, после <i>do/does/did</i> и модальных глаголов.</li>
   <li><b>V2</b> — Past Simple, завершённое действие в прошлом.</li>
   <li><b>V3</b> — после <i>have/has/had</i> в совершённых временах и в страдательном залоге после форм <i>be</i>.</li></ul>
   <ul><li><i>I work every day.</i> — Я работаю каждый день.</li><li><i>I worked yesterday.</i> — Я работал вчера.</li>
   <li><i>I have worked here for two years.</i> — Я работаю здесь уже два года.</li>
   <li><i>The work was finished.</i> — Работа была завершена.</li></ul>
   <p>Важно: после <i>did</i> используется V1, а не V2. Правильно: <i>Did you go?</i>, неправильно: <i>Did you went?</i></p>
   <p class="tip">Правильный ответ даёт +4%, ошибка −2%. Цель урока — дойти до 100%.</p>`,
  ex:[["Я работаю каждый день.","I work every day"],["Я работал вчера.","I worked yesterday"],["Я закончил работу.","I have finished the work"],
      ["Работа была завершена.","The work was finished"],["Ты ходил?","Did you go"],["Он ушёл домой.","He has gone home"],
      ["Она написала письмо.","She wrote a letter"],["Я видел это.","I have seen it"],["Они сделали это.","They have done it"],
      ["Он взял книгу.","He took the book"],["Я написал это.","I have written it"],["Она видела тебя?","Did she see you"]],
  w:[["go","идти"],["went","шёл (V2)"],["gone","ушедший (V3)"],["see","видеть"],["saw","видел (V2)"],["seen","увиденный (V3)"],
     ["do","делать"],["did","делал (V2)"],["done","сделанный (V3)"],["write","писать"],["wrote","написал (V2)"],["written","написанный (V3)"],
     ["take","брать"],["took","взял (V2)"],["taken","взятый (V3)"]]},

 {t:"Обозначение состояний",
  help:`<h3>Урок 2. Обозначение состояний</h3>
   <p>Важно различать действия и состояния.</p>
   <p><b>Действие</b> — то, что происходит или выполняется: работать, говорить, писать, двигаться.</p>
   <p><b>Состояние</b> — то, что человек чувствует, знает, имеет или воспринимает: знать, хотеть, любить, понимать, принадлежать.</p>
   <p>Для действий часто подходят формы Continuous: <i>I am working</i>, <i>She is talking</i>.</p>
   <p>Глаголы состояния обычно употребляются в Simple, даже о текущем моменте:</p>
   <ul><li><i>I know him.</i> — Я знаю его.</li><li><i>I want some water.</i> — Я хочу воды.</li>
   <li><i>She likes music.</i> — Ей нравится музыка.</li><li><i>I understand you.</i> — Я тебя понимаю.</li></ul>
   <p>Распространённые глаголы состояния: <i>know</i> (знать), <i>understand</i> (понимать), <i>believe</i> (верить), <i>want</i> (хотеть), <i>need</i> (нуждаться), <i>like</i> (нравиться), <i>love</i> (любить), <i>hate</i> (ненавидеть), <i>remember</i> (помнить), <i>belong</i> (принадлежать), <i>seem</i> (казаться).</p>
   <p>Некоторые глаголы обозначают и состояние, и действие — значение зависит от контекста:</p>
   <ul><li><i>I think you are right.</i> — Я считаю, что ты прав.</li><li><i>I am thinking about it.</i> — Я размышляю об этом.</li>
   <li><i>I have a car.</i> — У меня есть машина.</li><li><i>I am having lunch.</i> — Я обедаю.</li></ul>`,
