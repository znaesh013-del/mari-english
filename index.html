const ALLWORDS=(function(){const seen={},a=[];THEMES.forEach(t=>t.w.forEach(p=>{const k=p[0].toLowerCase();if(!seen[k]){seen[k]=1;a.push(p);}}));return a;})();
function wrec(en){return S.prof.data.words[en.toLowerCase()];}
function setRec(en,r){S.prof.data.words[en.toLowerCase()]=r;}
function themeWords(t){return t.n==="Все слова"?ALLWORDS:t.w;}
function themeStats(t){const ws=themeWords(t);let learned=0;ws.forEach(p=>{const r=wrec(p[0]);if(r&&r.learned)learned++;});return {total:ws.length,learned};}
function learnedAll(){const a=[],ws=S.prof.data.words;Object.keys(ws).forEach(k=>{if(ws[k]&&ws[k].learned){const p=ALLWORDS.find(x=>x[0].toLowerCase()===k);if(p)a.push(p);}});return a;}

function themesHome(v){
  const ld=learnedAll().length;
  const lb=el("button","lcard");
  lb.innerHTML=`<span class="lnum ${ld?'full':''}">✓</span><span style="flex:1;min-width:0"><h3>Выученные слова</h3><p>Словарь выученных · ${ld}</p></span><span class="chev">›</span>`;
  lb.onclick=()=>{S.view="tlearned";render();};
  v.append(lb);
  const rows=THEMES.concat([{n:"Все слова",ic:"📚",w:ALLWORDS}]);
  rows.forEach(t=>{
    const isart=t.type==="articles";
    const s=isart?artStats(t):themeStats(t),pct=s.total?Math.round(s.learned/s.total*100):0;
    const cnt=isart?t.q.length:t.w.length;
    const b=el("button","lcard");
    b.innerHTML=`<span class="tic">${t.ic}</span>
      <span style="flex:1;min-width:0"><h3>${t.n}</h3><p>${isart?'Заданий':'Слов'} ${cnt}</p></span>
      <span class="pctr ${pct>=100?'full':pct>0?'part':''}">${pct}%</span>`;
    b.onclick=isart?(()=>{S.theme=t;S.view="artrain";nextArt();}):(()=>{S.theme=t;S.tconfirm=false;S.view="tset";render();});
    v.append(b);
  });
}
function tset(v){
  const t=S.theme,s=themeStats(t);
  v.append(el("div","course",`${t.ic} ${t.n} · выучено ${s.learned}/${s.total}`));
  const learn=el("button","btn","Учить слова");learn.onclick=()=>startTheme(t);v.append(learn);
  const dict=el("button","btn ghost","Слова набора");dict.onclick=()=>{S.view="tdict";render();};v.append(dict);
  if(!S.tconfirm){const r=el("button","btn ghost","Сбросить статистику");r.onclick=()=>{S.tconfirm=true;render();};v.append(r);}
  else{
    const r=el("button","btn ghost","Точно сбросить? Нажми ещё раз");r.style.color="var(--bad)";r.onclick=()=>{resetTheme(t);S.tconfirm=false;render();};v.append(r);
    const c=el("button","btn ghost","Отмена");c.onclick=()=>{S.tconfirm=false;render();};v.append(c);
  }
}
function resetTheme(t){themeWords(t).forEach(p=>{delete S.prof.data.words[p[0].toLowerCase()];});saveDB();}
function startTheme(t){S.theme=t;S.tpool=themeWords(t);S.view="ttrain";nextTrain();}
function nextTrain(){
  const pool=S.tpool;
  let cand=pool.filter(p=>{const r=wrec(p[0]);return !(r&&r.learned);});
  if(!cand.length)cand=pool;
  cand.sort((a,b)=>((wrec(a[0])||{}).streak||0)-((wrec(b[0])||{}).streak||0));
  const slice=cand.slice(0,Math.max(1,Math.min(cand.length,8)));
  const pair=slice[Math.random()*slice.length|0];
  S.tcur={en:pair[0],ru:pair[1]};
  S.tdir=Math.random()<0.5?"ru2en":"en2ru";
  if(S.tdir==="ru2en"){
    S.tprompt=pair[1];S.tcorrect=pair[0];
    const o=pool.filter(p=>p[0]!==pair[0]).map(p=>p[0]);shuffle(o);
    S.topts=shuffle([pair[0],...o.slice(0,5)]);
  }else{
    S.tprompt=pair[0];S.tcorrect=pair[1];
    const o=pool.filter(p=>p[1]!==pair[1]).map(p=>p[1]);shuffle(o);
    S.topts=shuffle([pair[1],...o.slice(0,5)]);
  }
  S.tans=null;render();
  if(S.tdir==="en2ru")speak(pair[0],true);
}
function pickTrain(opt){
  if(S.tans!=null)return;
  S.tans=opt;
  const correct=opt===S.tcorrect;
  const r=wrec(S.tcur.en)||{streak:0,learned:false,reps:0};
  r.reps=(r.reps||0)+1;
  if(correct){r.streak=(r.streak||0)+1;if(r.streak>=10)r.learned=true;speak(S.tcur.en,true);}
  else r.streak=0;
  setRec(S.tcur.en,r);saveDB();
  render();
  setTimeout(nextTrain,correct?650:1150);
}
function ttrain(v){
  const t=S.theme,s=themeStats(t),pct=s.total?Math.round(s.learned/s.total*100):0;
  $("pfill").style.width=pct+"%";$("ppct").textContent=s.learned+"/"+s.total;
  v.append(el("div","prompt",S.tprompt));
  if(S.tdir==="en2ru"){const sp=el("button","spk","🔊");sp.onclick=()=>speak(S.tcur.en,true);v.append(sp);}
  const r=wrec(S.tcur.en)||{streak:0};
  v.append(el("p","hint","Подряд верно: "+(r.streak||0)+"/10 · "+(S.tdir==="ru2en"?"найди слово по-английски":"выбери перевод")));
  const grid=el("div","tgrid");
  S.topts.forEach(opt=>{
    let cls="ttile";
    if(S.tans!=null){if(opt===S.tcorrect)cls+=" right";else if(opt===S.tans)cls+=" wrong";}
    const b=el("button",cls,opt);b.onclick=()=>pickTrain(opt);grid.append(b);
  });
  v.append(grid);
}
function tdict(v){
  const t=S.theme;
  v.append(el("div","course",`${t.ic} ${t.n} · ${themeWords(t).length} слов`));
  const list=el("div","dlist");
  themeWords(t).forEach(p=>{
    const r=wrec(p[0])||{streak:0,learned:false};
    const row=el("div","drow");
    row.innerHTML=`<span class="dw"><b>${p[0]}</b><i>${p[1]}</i></span><span class="dbadge ${r.learned?'ok':''}">${r.learned?'✓':((r.streak||0)+'/10')}</span>`;
    list.append(row);
  });
  v.append(list);
}
function tlearned(v){
  const w=learnedAll();
  v.append(el("div","course","Словарь выученных · "+w.length));
  if(!w.length){v.append(el("div","msg","Пока пусто. Слово попадает сюда после 10 верных ответов подряд."));return;}
  const list=el("div","dlist");
  w.forEach(p=>{const row=el("div","drow");row.innerHTML=`<span class="dw"><b>${p[0]}</b><i>${p[1]}</i></span><span class="dbadge ok">✓</span>`;list.append(row);});
  v.append(list);
}

function artStats(t){let learned=0;t.q.forEach(function(q,i){const r=wrec("art:"+i);if(r&&r.learned)learned++;});return{total:t.q.length,learned:learned};}
function nextArt(){
  const t=S.theme,q=t.q;
  let cand=q.map(function(x,i){return i;}).filter(function(i){const r=wrec("art:"+i);return !(r&&r.learned);});
  if(!cand.length)cand=q.map(function(x,i){return i;});
  cand.sort(function(a,b){return ((wrec("art:"+a)||{}).streak||0)-((wrec("art:"+b)||{}).streak||0);});
  const slice=cand.slice(0,Math.max(1,Math.min(cand.length,6)));
  S.ai=slice[Math.random()*slice.length|0];
  S.aans=null;render();
}
function pickArt(opt){
  if(S.aans!=null)return;
  const q=S.theme.q[S.ai];
  S.aans=opt;
  const correct=opt===q.a;
  const r=wrec("art:"+S.ai)||{streak:0,learned:false,reps:0};
  r.reps=(r.reps||0)+1;
  if(correct){r.streak=(r.streak||0)+1;if(r.streak>=5)r.learned=true;}else r.streak=0;
  setRec("art:"+S.ai,r);saveDB();
  render();
  setTimeout(nextArt,correct?750:1250);
}

function playFrom(i){
  if(LP.mode==="audio"){if(!LP.audio)return;i=Math.max(0,Math.min(i,LP.words.length-1));LP.audio.currentTime=LP.words[i].start||0;LP.audio.play();LP.playing=true;updPlayBtn();return;}

  i=Math.max(0,Math.min(i,LP.words.length-1));

  if(BP.useAudio&&BP.audio){try{if(BP.audio.currentTime<startT-0.15||BP.audio.currentTime>startT+1)BP.audio.currentTime=startT;
    const p=BP.audio.play();if(p&&p.then)p.then(function(){BP.playing=true;bUpd();bLoop();}).catch(function(){BP.useAudio=false;bPlayV(startT);});
    else{BP.playing=true;bUpd();bLoop();}}catch(e){BP.useAudio=false;bPlayV(startT);}}
  else bPlayV(startT);
}
function bSeekFrac(f){const t=Math.max(0,Math.min(1,f))*BP.dur;const k=bFindWord(t);BP.hi=k;
  if(BP.useAudio&&BP.audio){try{BP.audio.currentTime=t;}catch(e){}}else{BP.base=t;BP.startAt=performance.now();}
  bSetHi(k,true);bBar(t/BP.dur);}
function bWordTap(i){const w=BP.words[i];stopBook();bUpd();BP.hi=i;bSetHi(i,false);
  const key=w.w.toLowerCase().replace(/[^a-z']/g,"");const ru=glossLook(key)||"—";
  const bar=document.getElementById("binfo");
  if(bar){bar.hidden=false;bar.innerHTML='<span>'+esc(w.w)+' — '+esc(ru)+'</span><button class="sp" id="binfospk">🔊</button>';
    const sp=document.getElementById("binfospk");if(sp)sp.onclick=function(){speak(w.w,true);};}
  speak(w.w,true);
}
function bquiz(v){
  const b=BP.book,qs=b.questions;
  if(S.bqi>=qs.length){
    const prof=S.prof.data.books;prof[b.id]={done:true,correct:S.bqscore,total:qs.length};saveDB();
    v.append(el("div","done",'<div class="ring">'+S.bqscore+'/'+qs.length+'</div><h2>Готово!</h2><p>Правильных ответов: '+Math.round(S.bqscore/qs.length*100)+'%. Результат сохранён в профиле.</p>'));
    const a=el("button","btn ghost","Заново");a.onclick=function(){S.bqi=0;S.bqans=null;S.bqscore=0;render();};
    const h=el("button","btn","К книге");h.onclick=function(){S.view="reader";render();};
    v.append(a);v.append(h);return;
  }
  const q=qs[S.bqi];
  v.append(el("p","hint",(S.bqi+1)+" / "+qs.length));
  v.append(el("div","prompt",q.q));
  const opts=el("div","wopts");
  q.options.forEach(function(o,i){
    let cls="wopt";if(S.bqans!=null){if(i===q.answer)cls+=" right";else if(i===S.bqans)cls+=" wrong";}
    const bb=el("button",cls,o);bb.onclick=function(){pickBQuiz(i);};opts.append(bb);
  });
  v.append(opts);
}
function pickBQuiz(i){if(S.bqans!=null)return;S.bqans=i;if(i===BP.book.questions[S.bqi].answer)S.bqscore++;render();
  setTimeout(function(){S.bqi++;S.bqans=null;render();},950);}

/* ---------- user-imported books (drop audio + .srt) ---------- */
var USERBOOKS=[];
function bidbOpen(){return new Promise(function(res,rej){try{var r=indexedDB.open("mari_books",1);
  r.onupgradeneeded=function(e){var db=e.target.result;if(!db.objectStoreNames.contains("books"))db.createObjectStore("books",{keyPath:"id"});};
  r.onsuccess=function(e){res(e.target.result);};r.onerror=function(e){rej(e);};}catch(e){rej(e);}});}
function bidbPut(rec){return bidbOpen().then(function(db){return new Promise(function(res,rej){var t=db.transaction("books","readwrite");t.objectStore("books").put(rec);t.oncomplete=function(){res();};t.onerror=function(e){rej(e);};});});}
function bidbAll(){return bidbOpen().then(function(db){return new Promise(function(res,rej){var t=db.transaction("books","readonly");var q=t.objectStore("books").getAll();q.onsuccess=function(){res(q.result||[]);};q.onerror=function(e){rej(e);};});});}
function bidbDel(id){return bidbOpen().then(function(db){return new Promise(function(res,rej){var t=db.transaction("books","readwrite");t.objectStore("books").delete(id);t.oncomplete=function(){res();};t.onerror=function(e){rej(e);};});});}
function loadUserBooks(){return bidbAll().then(function(list){list.forEach(function(r){r.custom=true;});list.sort(function(a,b){return (a.title||"").localeCompare(b.title||"");});USERBOOKS=list;}).catch(function(){USERBOOKS=[];});}
function srtTs(s){s=s.replace(",",".");var p=s.split(":");return (+p[0])*3600+(+p[1])*60+parseFloat(p[2]);}
function parseSRT(text){text=text.replace(/\r/g,"");var blocks=text.trim().split(/\n\s*\n/);var words=[];
  for(var i=0;i<blocks.length;i++){var lines=blocks[i].split("\n").filter(function(l){return l.trim()!=="";});if(lines.length<2)continue;
    var tl=lines[0].indexOf("-->")>=0?0:(lines[1]&&lines[1].indexOf("-->")>=0?1:-1);if(tl<0)continue;
    var m=lines[tl].match(/(\d\d:\d\d:\d\d[,.]\d+)\s*-->\s*(\d\d:\d\d:\d\d[,.]\d+)/);if(!m)continue;
    var w=lines.slice(tl+1).join(" ").trim();if(!w)continue;
    words.push({w:w,s:+srtTs(m[1]).toFixed(3),e:+srtTs(m[2]).toFixed(3)});}
  return words;}
function buildParas(words){var paras=[0];for(var i=1;i<words.length;i++){var gap=words[i].s-words[i-1].e;var prev=words[i-1].w;var endsent=/[.?!"]$/.test(prev);if((endsent&&gap>0.7)||gap>1.6)paras.push(i);}return paras;}
function importBooks(fileList){
  var files=Array.prototype.slice.call(fileList||[]);
  var srt=null,aud=null;
  files.forEach(function(f){if(/\.srt$/i.test(f.name))srt=f;else if(/\.(mp3|m4a|aac|ogg|oga|opus|wav|flac|webm)$/i.test(f.name)||/^audio\//.test(f.type))aud=f;});
  if(!srt||!aud){alert("Выбери два файла сразу: аудио (mp3, m4a…) и субтитры .srt.");return;}
  var base=srt.name.replace(/\.[^.]+$/,"");
  var fr=new FileReader();
  fr.onerror=function(){alert("Не удалось прочитать файл субтитров.");};
  fr.onload=function(){
    var words=parseSRT(String(fr.result));
    if(!words.length){alert("В .srt не нашлось строк с таймкодами.");return;}
    var paras=buildParas(words);
    var rec={id:"u_"+Date.now().toString(36),title:base,author:"Моя книга",level:"импорт",source:"Добавлено на этом устройстве",dur:words[words.length-1].e,words:words,paras:paras,questions:[],audioBlob:aud,custom:true};
    bidbPut(rec).then(function(){return loadUserBooks();}).then(function(){S.view="books";render();})
      .catch(function(){alert("Не удалось сохранить книгу (возможно, не хватает места в памяти устройства).");});
  };
  fr.readAsText(srt);
}

/* ---------- navigation ---------- */
$("back").onclick=()=>{
  const v=S.view;stopPlayer();stopBook();
  if(v==="hub")S.view="profiles";
  else if(v==="course"||v==="themes"||v==="listen"||v==="materials"||v==="books")S.view="hub";
  else if(v==="reader")S.view="books";

  else if(v==="artrain")S.view="themes";
  else if(v==="lesson")S.view="course";
  else if(v==="train"||v==="done"||v==="wtrain"||v==="wdone")S.view="lesson";
  else if(v==="tset"||v==="tlearned")S.view="themes";
  else if(v==="ttrain"||v==="tdict")S.view="tset";

  else if(v==="rplay")S.view="raudio";
  else if(v==="lplay")S.view="listen";

  S.sound=!S.sound;$("sound").setAttribute("aria-pressed",S.sound);
  $("sound").textContent=S.sound?"🔊":"🔈";if(S.sound)speak("Sound on",true);
};

/* ===== PWA + облачные аудиоуроки ===== */
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('service-worker.js').catch(function(){});});}
const ASSETS_BASE=""; /* ← укажи адрес своего облака, напр. "https://files.example.com/mari". Пусто = выключено. */
function baseUrl(){return ASSETS_BASE.replace(/\/+$/,"");}
function idb(){return new Promise(function(res,rej){var r;try{r=indexedDB.open("mari-assets",1);}catch(e){return rej(e);}r.onupgradeneeded=function(){try{r.result.createObjectStore("f");}catch(e){}};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function idbGet(k){return idb().then(function(db){return new Promise(function(res){var t=db.transaction("f").objectStore("f").get(k);t.onsuccess=function(){res(t.result||null);};t.onerror=function(){res(null);};});}).catch(function(){return null;});}
function idbPut(k,v){return idb().then(function(db){return new Promise(function(res){var t=db.transaction("f","readwrite").objectStore("f").put(v,k);t.onsuccess=function(){res(true);};t.onerror=function(){res(false);};});}).catch(function(){return false;});}
var REMOTE=[],REMOTE_LOADED=false;
function loadRemote(){REMOTE=[];if(!ASSETS_BASE)return Promise.resolve();return fetch(baseUrl()+"/lessons.json",{cache:"no-store"}).then(function(r){return r.json();}).then(function(j){REMOTE=j||[];REMOTE_LOADED=true;}).catch(function(){REMOTE=[];REMOTE_LOADED=true;});}
function downloadLesson(L){var b=baseUrl();return fetch(b+"/"+L.audio).then(function(a){if(!a.ok)throw 0;return a.blob();}).then(function(bl){return idbPut("audio:"+L.id,bl);}).then(function(){return fetch(b+"/"+L.words);}).then(function(w){if(!w.ok)throw 0;return w.text();}).then(function(t){return idbPut("words:"+L.id,t);});}
function raudioHome(v){
  v.append(el("p","lead","Аудиоуроки с живым голосом. Скачай урок — он сохранится в память телефона и будет работать офлайн."));
  if(!ASSETS_BASE){v.append(el("div","msg","Облако не подключено. Впиши адрес своего облака в ASSETS_BASE (index.html, см. README) — и уроки появятся здесь."));return;}
  if(!REMOTE_LOADED){v.append(el("div","msg","Загружаю список…"));loadRemote().then(render);return;}
  if(!REMOTE.length){v.append(el("div","msg","Список пуст или недоступен. Проверь lessons.json, HTTPS и CORS."));return;}
  REMOTE.forEach(function(L){
    var row=el("button","lcard");
    row.innerHTML='<span class="lnum" id="rst-'+L.id+'">🎧</span><span style="flex:1;min-width:0"><h3>'+L.title+'</h3><p>'+(L.level||'')+(L.source?' · '+L.source:'')+'</p></span><span class="chev">›</span>';
    row.onclick=function(){
      idbGet("audio:"+L.id).then(function(has){
        if(has){openRemote(L);return;}
        var c=document.getElementById("rst-"+L.id);if(c)c.textContent="⏬";
        downloadLesson(L).then(function(){openRemote(L);}).catch(function(){if(c)c.textContent="⚠";});
      });
    };
    v.append(row);
  });
}
function openRemote(L){
  stopPlayer();
  Promise.all([idbGet("audio:"+L.id),idbGet("words:"+L.id)]).then(function(r){
    var ab=r[0],wj=r[1];if(!ab||!wj){S.view="raudio";render();return;}
    S.rl=L;LP.mode="audio";LP.lesson=L;
    try{LP.words=JSON.parse(wj);}catch(e){LP.words=[];}
    LP.audio=new Audio(URL.createObjectURL(ab));
    LP.audio.ontimeupdate=function(){var t=LP.audio.currentTime,k=-1;for(var j=0;j<LP.words.length;j++){if(LP.words[j].start<=t)k=j;else break;}setHi(k);setBar(LP.audio.duration?t/LP.audio.duration:0);};
    LP.audio.onended=function(){LP.playing=false;updPlayBtn();};
    S.view="rplay";render();
  });
}
function rplay(v){
  var L=LP.lesson;
  v.append(el("div","srcnote","Источник: "+(L.source||"")+" · офлайн"));
  var ctr=el("div","pcontrols");
  var restart=el("button","pbtn sec","⏮");restart.onclick=function(){if(LP.audio){LP.audio.currentTime=0;LP.audio.play();LP.playing=true;updPlayBtn();}};
  var play=el("button","pbtn","▶");play.id="pbtn";play.onclick=togglePlay;
  var bar=el("div","pbar2",'<i id="lbar"></i>');bar.onclick=function(e){var r=bar.getBoundingClientRect();seekFrac((e.clientX-r.left)/r.width);};
  ctr.append(restart);ctr.append(play);ctr.append(bar);v.append(ctr);
  var info=el("div","infobar");info.id="linfo";info.hidden=true;v.append(info);
  var txt=el("div","ltext");txt.id="ltext";var out="";LP.words.forEach(function(w,i){out+=(i?" ":"")+'<span class="lword" id="lw'+i+'">'+esc(w.w)+'</span>';});txt.innerHTML=out;v.append(txt);
  LP.words.forEach(function(w,i){var sp=document.getElementById("lw"+i);if(sp)sp.onclick=function(){if(LP.audio){LP.audio.currentTime=w.start||0;LP.audio.play();LP.playing=true;updPlayBtn();}var ru=(L.gloss&&L.gloss[(w.w||"").toLowerCase()])||"";var b2=document.getElementById("linfo");if(b2&&ru){b2.hidden=false;b2.innerHTML='<span>'+esc(w.w)+' — '+esc(ru)+'</span>';}};});
  if(L.questions&&L.questions.length){var q=el("button","btn","Вопросы ("+L.questions.length+")");q.onclick=function(){S.lqi=0;S.lqans=null;S.lqscore=0;S.view="lquiz";render();};v.append(q);}
  updPlayBtn();
}
if(ASSETS_BASE&&!REMOTE_LOADED){loadRemote();}

render();
try{loadUserBooks().then(function(){if(S.view==="books")render();});}catch(e){}
</script>
